<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Expenses Log — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" id="header-logo-container"></div>
      <div>
        <span id="txt-cafe-name">Expenses Log</span>
        <div id="active-user-role" class="role-badge">EXPENSE</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Connecting...</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage(renderExpenses)">🌐 <span id="lbl-lang">English</span></button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN EXPENSES WRAPPER -->
  <main class="main-wrapper">
    <!-- TODAY'S SPEND BANNER -->
    <div class="tm-card" style="background:#fef2f2;border:1px solid #fecaca;">
      <div style="font-size:11px;font-weight:700;color:#991b1b;text-transform:uppercase;">Today's Total Spend</div>
      <div style="font-size:26px;font-weight:800;color:#dc2626;margin-top:2px;" id="val-today-spend">₹ 0.00</div>
    </div>

    <!-- EXPENSES LEDGER CARD -->
    <div class="tm-card">
      <div class="tm-card-title">
        <span>Expense Entries Ledger</span>
        <button class="btn-sm-outline" style="background:#eff6ff;color:var(--primary);" onclick="openAddExpenseModal()">+ Add Expense</button>
      </div>

      <!-- CATEGORY SCROLL TABS -->
      <div class="cat-scroll" id="expense-cat-tabs">
        <button class="cat-btn active" onclick="setExpenseCategory('All')">All</button>
        <button class="cat-btn" onclick="setExpenseCategory('Raw Materials')">Raw Materials</button>
        <button class="cat-btn" onclick="setExpenseCategory('Utilities')">Utilities</button>
        <button class="cat-btn" onclick="setExpenseCategory('Salaries')">Salaries</button>
        <button class="cat-btn" onclick="setExpenseCategory('Rent')">Rent</button>
        <button class="cat-btn" onclick="setExpenseCategory('Other')">Other</button>
      </div>

      <!-- EXPENSES TABLE -->
      <div class="table-responsive" style="margin-top:10px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expense-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- FOOTER BRANDING -->
    <div class="dev-footer">
      Powered by <b>TableMaster Pro Enterprise Cloud</b><br>
      Software Developed by: <b>Debapriya Sarkar</b> (9046356631)
    </div>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-bar">
    <a href="index.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 011 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="pos.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      <span>Order</span>
    </a>
    <a href="kitchen.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
      <span>Kitchen</span>
    </a>
    <a href="bills.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Bills</span>
    </a>
    <a href="menu.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span>Menu</span>
    </a>
  </nav>

  <!-- MODAL SHEET -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
    <div class="sheet-modal">
      <div class="sheet-head">
        <div class="sheet-title" id="sheet-title">Add Expense</div>
        <button class="btn-x" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script>
let selectedCategory = 'All';
let activeCafeId = '';

function handleLogout() {
  if (confirm("Log out from Expenses Terminal?")) {
    sessionStorage.removeItem('tmpro_role_mode');
    sessionStorage.removeItem('tmpro_cafe_id');
    auth.signOut().then(() => {
      window.location.href = 'index.html';
    });
  }
}

function setExpenseCategory(cat) {
  selectedCategory = cat;
  const buttons = document.querySelectorAll('#expense-cat-tabs .cat-btn');
  buttons.forEach(btn => {
    btn.classList.toggle('active', btn.innerText.trim() === cat);
  });
  renderExpenses();
}

function getBadgeClass(cat) {
  if (cat === 'Raw Materials') return 'cat-raw';
  if (cat === 'Salaries') return 'cat-sal';
  return 'cat-other';
}

function renderExpenses() {
  const data = window.getData();
  updateHeaderBrand(data);
  document.getElementById('lbl-lang').innerText = currentLang === 'en' ? 'English' : 'বাংলা';

  const today = window.todayStr();
  const allExpenses = data.expenses || [];
  
  const todaySpend = allExpenses.filter(e => e.date === today).reduce((sum, e) => sum + (e.amount || 0), 0);
  document.getElementById('val-today-spend').innerText = `₹ ${todaySpend.toFixed(2)}`;

  let list = [...allExpenses];
  if (selectedCategory !== 'All') {
    list = list.filter(e => e.category === selectedCategory);
  }

  const tbody = document.getElementById('expense-table-body');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">No expense entries recorded for this filter.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(e => `
    <tr>
      <td><b>${e.date}</b></td>
      <td><span class="badge ${getBadgeClass(e.category)}">${e.category || 'Other'}</span></td>
      <td>${e.desc}</td>
      <td style="font-weight:700;color:#dc2626;">₹ ${(e.amount || 0).toFixed(2)}</td>
      <td>
        <button class="btn-danger" style="padding:4px 8px;font-size:10px;" onclick="deleteExpenseEntry('${e.id}')">✕</button>
      </td>
    </tr>
  `).join('');
}

function openAddExpenseModal() {
  const form = `
    <label>Expense Category</label>
    <select id="exp-cat">
      <option value="Raw Materials">Raw Materials (Kitchen Supplies)</option>
      <option value="Utilities">Utilities (Gas / Electricity / Water)</option>
      <option value="Salaries">Staff Salaries / Wages</option>
      <option value="Rent">Shop / Premises Rent</option>
      <option value="Marketing">Marketing & Advertising</option>
      <option value="Other">Other Expenses</option>
    </select>

    <label>Description / Item Details</label>
    <input type="text" id="exp-desc" placeholder="e.g. 5kg Chicken & Spices">

    <label>Amount Spent (₹)</label>
    <input type="number" id="exp-amt" placeholder="e.g. 1200" step="0.01">

    <button class="btn-primary" id="btn-save-exp" onclick="saveNewExpenseEntry()">Save Expense Entry</button>
  `;
  openSheet("Add Expense Entry", form);
}

async function saveNewExpenseEntry() {
  if (!activeCafeId || !db) return;
  const cat = document.getElementById('exp-cat').value;
  const desc = document.getElementById('exp-desc').value.trim();
  const amt = parseFloat(document.getElementById('exp-amt').value);
  const btn = document.getElementById('btn-save-exp');

  if (!desc || isNaN(amt) || amt <= 0) {
    alert("Please enter valid expense description and amount!");
    return;
  }

  if (btn) { btn.disabled = true; btn.innerText = "Saving..."; }

  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const expenses = cData.expenses || [];
    expenses.unshift({
      id: 'exp_' + Date.now(),
      category: cat,
      desc: desc,
      amount: amt,
      date: window.todayStr()
    });

    await cafeRef.update({ expenses });
    closeSheet();
    renderExpenses();
  } catch(err) {
    alert("Failed to save expense: " + err.message);
    if (btn) { btn.disabled = false; btn.innerText = "Save Expense Entry"; }
  }
}

async function deleteExpenseEntry(id) {
  if (!activeCafeId || !db) return;
  if (!confirm("Are you sure you want to delete this expense record?")) return;

  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const expenses = (cData.expenses || []).filter(e => e.id !== id);
    await cafeRef.update({ expenses });
    renderExpenses();
  } catch(err) {
    alert("Failed to delete expense: " + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    auth.onAuthStateChanged((user) => {
      activeCafeId = sessionStorage.getItem('tmpro_cafe_id') || (user ? 'cafe_' + user.uid : null);
      if (activeCafeId) {
        bindCafeCloudListener(activeCafeId, renderExpenses);
      } else {
        window.location.href = 'index.html';
      }
    });
  }
});
</script>
</body>
</html>
