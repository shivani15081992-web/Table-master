<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Customer Self-Order — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<style>
.customer-hero {
  background: radial-gradient(circle at 15% 10%, rgba(201,169,97,0.15) 0%, transparent 45%),
    linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
  color: #fff;
  padding: 24px 16px 20px;
  padding-top: calc(24px + env(safe-area-inset-top));
  text-align: center;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.customer-logo-circle {
  width: 56px; height: 56px; margin: 0 auto 10px;
  border-radius: 50%; overflow: hidden;
  border: 1.5px solid rgba(201,169,97,0.5);
  background: rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
}
.customer-cafe-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 700;
  color: #e8d5a1; line-height: 1.2;
}
.customer-table-badge {
  display: inline-block; padding: 4px 14px;
  border: 1px solid rgba(201,169,97,0.4);
  border-radius: 100px;
  font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase;
  color: #e8d5a1; font-weight: 700; margin-top: 6px;
}
.dish-paused {
  opacity: 0.6;
  filter: grayscale(80%);
  background: #fdf2f2 !important;
  border-color: #fca5a5 !important;
}
</style>
</head>
<body class="customer-mode" style="background:var(--cream);">

  <!-- CUSTOMER HERO HEADER -->
  <header class="customer-hero">
    <div class="customer-logo-circle" id="customer-logo-wrap">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1a1a'/><path d='M160 120v110c0 22 18 40 40 40h20a40 40 0 0 0 40-40V120M210 120v272M352 260V120a70 70 0 0 0-70 70v70c0 22 18 40 40 40h30v132' fill='none' stroke='%23e8d5a1' stroke-width='26' stroke-linecap='round' stroke-linejoin='round'/></svg>" style="width:100%;height:100%;object-fit:cover;" alt="Logo">
    </div>
    <h1 class="customer-cafe-name" id="cust-cafe-name">Restaurant Menu</h1>
    <div class="customer-divider" style="display:flex;align-items:center;gap:10px;margin:8px auto;max-width:160px;color:#c9a961;font-size:8px;">
      <span style="flex:1;height:1px;background:rgba(201,169,97,0.4);"></span><i>◆</i><span style="flex:1;height:1px;background:rgba(201,169,97,0.4);"></span>
    </div>
    <div class="customer-table-badge" id="cust-table-badge">TABLE ORDER</div>
  </header>

  <!-- MAIN CUSTOMER MENU AREA -->
  <main class="customer-main" id="cust-menu-area" style="padding:14px;padding-bottom:110px;max-width:800px;margin:0 auto;">
    
    <!-- LOADING SPINNER -->
    <div class="customer-loading-wrap" id="cust-loading" style="text-align:center;padding:50px 20px;">
      <div class="customer-loading-spinner" style="width:40px;height:40px;margin:0 auto 14px;border:3px solid #ebe3d2;border-top-color:#c9a961;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:#6b5540;font-weight:700;">Loading Food Menu...</div>
      <p style="font-size:12px;color:#8b6d38;margin-top:4px;">Connecting to restaurant cloud</p>
    </div>

    <!-- MENU CONTENT -->
    <div id="cust-menu-content" style="display:none;">
      <!-- SEARCH INPUT -->
      <div class="customer-search-wrap" style="position:relative;margin-bottom:14px;">
        <input type="text" class="customer-search-input" id="cust-search" placeholder="🔍 Search dishes..." oninput="custSearchQuery=this.value; renderCustomerMenu();" style="width:100%;padding:11px 14px;background:#fff;border:1px solid var(--cream-border);border-radius:100px;font-size:13.5px;color:#1a1a1a;">
      </div>

      <!-- CATEGORY TABS -->
      <div class="customer-cats-wrap" id="cust-cats-container" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:none;"></div>

      <!-- DISHES GRID -->
      <div class="customer-dish-grid" id="cust-dish-grid" style="display:grid;grid-template-columns:1fr;gap:10px;"></div>
    </div>
  </main>

  <!-- FLOATING CART BAR -->
  <div class="customer-cart-bar" id="cust-cart-bar" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;padding:12px;background:linear-gradient(180deg, transparent 0%, var(--cream) 40%);">
    <div class="customer-cart" style="background:linear-gradient(135deg, #1a1a1a, #2d2d2d);color:#fff;border-radius:18px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(201,169,97,0.3);box-shadow:0 12px 28px rgba(0,0,0,0.3);">
      <div>
        <div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#c9a961;" id="cust-cart-count">0 Items Selected</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#e8d5a1;" id="cust-cart-total">₹ 0.00</div>
      </div>
      <button class="ccb-btn" onclick="openCustCartReviewSheet()" style="background:linear-gradient(135deg, #c9a961, #e8d5a1);color:#1a1a1a;border:none;border-radius:12px;padding:9px 18px;font-weight:800;font-size:12px;cursor:pointer;">View Order →</button>
    </div>
  </div>

  <!-- MODAL SHEET -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
    <div class="sheet-modal">
      <div class="sheet-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div class="sheet-title" id="sheet-title" style="font-family:'Cormorant Garamond',serif;font-size:20px;color:#1a1a1a;font-weight:700;">Review Your Order</div>
        <button class="btn-x" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script>
let custCart = [];
let targetCafeId = null;
let targetTableId = null;
let activePlacedOrderId = null; // বর্তমান চলমান সেশনের অর্ডার আইডি
let custSelectedCat = 'All';
let custSearchQuery = '';

function renderCustomerMenu() {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === targetTableId);

  // সেশন সেফটি চেক: যদি কাস্টমার আগেই একটি অর্ডার দিয়ে থাকে এবং ক্যাশিয়ার সেই অর্ডারটি সেটেল করে দেয়
  if (activePlacedOrderId) {
    const existingOrder = (data.orders || []).find(o => o.id === activePlacedOrderId);
    if (existingOrder && existingOrder.status === 'completed') {
      // বিল সেটেল হয়ে গেছে — বাড়ি যাওয়া কাস্টমারের পুরোনো পেজ ফ্রিজ হয়ে যাবে
      document.getElementById('cust-cart-bar').style.display = 'none';
      document.getElementById('cust-menu-area').innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <div style="width:70px;height:70px;background:#ecfdf5;color:#059669;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;border:2px solid #a7f3d0;">✓</div>
          <h2 style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#065f46;margin-bottom:8px;">Bill Settled Successfully!</h2>
          <p style="color:#6b5540;font-size:13.5px;max-width:320px;margin:0 auto;line-height:1.5;">
            Thank you for dining with us! If you are still at the table and want to order more food, please <b>re-scan the table QR code</b> with your camera.
          </p>
        </div>
      `;
      return;
    }
  }

  document.getElementById('cust-cafe-name').innerText = data.name || 'TableMaster Restaurant';

  const logoWrap = document.getElementById('customer-logo-wrap');
  if (data.logo && data.logo.trim() !== '') {
    logoWrap.innerHTML = `<img src="${data.logo}" style="width:100%;height:100%;object-fit:cover;" alt="Logo">`;
  } else {
    logoWrap.innerHTML = `<img src="${DEFAULT_GOLD_SVG_LOGO}" style="width:100%;height:100%;object-fit:cover;" alt="Default Logo">`;
  }

  document.getElementById('cust-table-badge').innerText = tbl ? `${tbl.name} · Table Order` : 'Welcome';

  document.getElementById('cust-loading').style.display = 'none';
  document.getElementById('cust-menu-content').style.display = 'block';

  const cats = ['All', ...new Set((data.menu || []).map(m => m.category || 'General'))];
  document.getElementById('cust-cats-container').innerHTML = cats.map(c => `
    <button class="customer-cat-btn ${custSelectedCat === c ? 'active' : ''}" onclick="custSelectedCat='${c}'; renderCustomerMenu();">${c}</button>
  `).join('');

  let dishes = custSelectedCat === 'All' ? (data.menu || []) : (data.menu || []).filter(m => (m.category || 'General') === custSelectedCat);
  if (custSearchQuery.trim()) {
    const q = custSearchQuery.toLowerCase();
    dishes = dishes.filter(d => (d.name && d.name.toLowerCase().includes(q)) || (d.category && d.category.toLowerCase().includes(q)));
  }

  const grid = document.getElementById('cust-dish-grid');
  if (dishes.length === 0) {
    grid.innerHTML = '<div style="text-align:center;padding:30px;color:#8b6d38;font-family:\'Cormorant Garamond\',serif;font-size:18px;">No matching food items found.</div>';
  } else {
    grid.innerHTML = dishes.map(d => {
      const isAvailable = d.available !== false;
      return `
        <div class="customer-dish-card ${!isAvailable ? 'dish-paused' : ''}" ${isAvailable ? `onclick="addToCustCart('${d.id}')"` : ''}>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="cdc-category">${d.category || 'General'}</div>
            ${!isAvailable ? '<span style="font-size:10px;background:#fee2e2;color:#b91c1c;padding:2px 8px;border-radius:100px;font-weight:800;">OUT OF STOCK</span>' : ''}
          </div>
          <div class="cdc-name" style="${!isAvailable ? 'text-decoration:line-through;color:#991b1b;' : ''}">${d.name}</div>
          <div class="cdc-footer">
            <div class="cdc-price">₹ ${d.price}</div>
            ${isAvailable ? `
              <button class="cdc-add-btn" onclick="event.stopPropagation(); addToCustCart('${d.id}')">+</button>
            ` : `
              <button style="border:none;background:#e2e8f0;color:#94a3b8;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;cursor:not-allowed;" disabled>Unavailable</button>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  updateCustCartBar();
}

function addToCustCart(dishId) {
  const data = window.getData();
  const dish = (data.menu || []).find(d => d.id === dishId);
  if (!dish || dish.available === false) return;

  const match = custCart.find(i => i.dishId === dishId);
  if (match) {
    match.qty += 1;
  } else {
    custCart.push({ dishId, name: dish.name, price: dish.price, qty: 1, isAddOn: true });
  }
  updateCustCartBar();
}

function updateCustCartBar() {
  const count = custCart.reduce((s, i) => s + i.qty, 0);
  const total = custCart.reduce((s, i) => s + (i.price * i.qty), 0);
  const bar = document.getElementById('cust-cart-bar');
  if (count > 0) {
    bar.style.display = 'block';
    document.getElementById('cust-cart-count').innerText = `${count} Items Selected`;
    document.getElementById('cust-cart-total').innerText = `₹ ${total.toFixed(2)}`;
  } else {
    bar.style.display = 'none';
  }
}

function openCustCartReviewSheet() {
  const data = window.getData();
  const subtotal = custCart.reduce((s, i) => s + (i.price * i.qty), 0);
  const gstRate = parseFloat(data.gstRate) || 0;
  const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
  const grandTotal = subtotal + gst;

  const html = `
    <div style="font-family:'Cormorant Garamond',serif;font-weight:700;margin-bottom:12px;font-size:18px;color:#1a1a1a;">Selected Items</div>
    ${custCart.map((it, idx) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--cream-border);">
        <div style="flex:1;">
          <div style="font-weight:700;font-size:13.5px;color:#1a1a1a;">${it.name}</div>
          <div style="font-size:11px;color:#8b6d38;">₹ ${it.price} × ${it.qty}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="qty-btn" onclick="changeCustQty(${idx}, -1)">−</button>
          <b style="min-width:18px;text-align:center;">${it.qty}</b>
          <button class="qty-btn" onclick="changeCustQty(${idx}, 1)">+</button>
          <b style="min-width:60px;text-align:right;color:#8b6d38;">₹ ${(it.price * it.qty).toFixed(0)}</b>
        </div>
      </div>
    `).join('')}
    
    <div style="margin-top:14px;font-size:12.5px;color:#6b5540;">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>Subtotal:</span><span>₹ ${subtotal.toFixed(2)}</span></div>
      ${gstRate > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>GST (${gstRate}%):</span><span>₹ ${gst.toFixed(2)}</span></div>` : ''}
    </div>
    
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding-top:12px;border-top:1px dashed var(--cream-border);font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#1a1a1a;">
      <span>Total Due:</span>
      <span style="color:#8b6d38;">₹ ${grandTotal.toFixed(2)}</span>
    </div>

    <button class="btn-primary" id="btn-cust-place" onclick="submitCustomerOrderToKitchen()">✓ Confirm & Send Order to Kitchen</button>
  `;
  openSheet("Confirm Order", html);
}

function changeCustQty(idx, delta) {
  custCart[idx].qty += delta;
  if (custCart[idx].qty <= 0) custCart.splice(idx, 1);
  if (custCart.length === 0) {
    closeSheet();
    updateCustCartBar();
    return;
  }
  openCustCartReviewSheet();
  updateCustCartBar();
}

async function submitCustomerOrderToKitchen() {
  if (custCart.length === 0 || !db || !targetCafeId) return;
  const btn = document.getElementById('btn-cust-place');
  if (btn) { btn.disabled = true; btn.innerText = "Placing order..."; }

  try {
    const cafeRef = db.collection("cafes").doc(targetCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) throw new Error("Cafe data not found!");

    const cData = docSnap.data();
    if (!cData.orders) cData.orders = [];
    if (!cData.tables) cData.tables = [];

    const subtotal = custCart.reduce((s, i) => s + (i.price * i.qty), 0);
    const gstRate = parseFloat(cData.gstRate) || 0;
    const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
    const total = subtotal + gst;

    // টেবিলে বর্তমানে আনসেটেল্ড কোনো অর্ডার চলছে কিনা যাচাই
    const existingOrder = cData.orders.find(o => o.tableId === targetTableId && o.status !== 'completed');

    if (existingOrder) {
      // টেবিলে আগের অর্ডার রানিং থাকলে সরাসরি Add-On হিসেবে কিচেনে যুক্ত হবে
      existingOrder.items.forEach(it => it.isAddOn = false);
      custCart.forEach(ni => {
        const m = existingOrder.items.find(i => i.dishId === ni.dishId);
        if (m) {
          m.qty += ni.qty;
          m.isAddOn = true;
        } else {
          existingOrder.items.push({ ...ni, isAddOn: true });
        }
      });
      existingOrder.subtotal = existingOrder.items.reduce((s, i) => s + (i.price * i.qty), 0);
      existingOrder.gst = gstRate > 0 ? (existingOrder.subtotal * (gstRate / 100)) : 0;
      existingOrder.total = existingOrder.subtotal + existingOrder.gst;
      existingOrder.status = 'preparing'; // কিচেনে নতুন আইটেম রান্নার নোটিফিকেশন যাবে
      activePlacedOrderId = existingOrder.id;
    } else {
      // একদম নতুন অর্ডার তৈরি হচ্ছে
      const newOrderId = 'ord_' + Date.now();
      const orderNum = 100 + cData.orders.length + 1;
      cData.orders.push({
        id: newOrderId,
        kotNo: orderNum,
        billNo: orderNum,
        tableId: targetTableId || 't1',
        items: custCart.map(it => ({ ...it, isAddOn: true })),
        subtotal,
        gst,
        gstRate,
        total,
        status: 'preparing',
        source: 'customer_qr',
        date: window.todayStr(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      activePlacedOrderId = newOrderId;
    }

    const tbl = cData.tables.find(t => t.id === targetTableId);
    if (tbl) tbl.status = 'occupied';

    await cafeRef.update({
      orders: cData.orders,
      tables: cData.tables
    });

    custCart = [];
    closeSheet();
    document.getElementById('cust-cart-bar').style.display = 'none';

    // সফল অর্ডার কনফার্মেশন ব্যানার
    document.getElementById('cust-menu-area').innerHTML = `
      <div style="text-align:center;padding:50px 16px;">
        <div style="width:70px;height:70px;background:#10b981;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px;">✓</div>
        <h2 style="font-family:'Cormorant Garamond',serif;font-size:24px;color:#1a1a1a;margin-bottom:6px;">Order Sent to Kitchen!</h2>
        <p style="color:#6b5540;font-size:13.5px;">Your delicious food is being prepared. 🍽️</p>
        <button class="btn-primary" style="margin-top:24px;max-width:240px;" onclick="renderCustomerMenu()">+ Add More Dishes</button>
      </div>
    `;
  } catch (err) {
    alert("Order failed: " + err.message);
    if (btn) { btn.disabled = false; btn.innerText = "✓ Confirm & Send Order to Kitchen"; }
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  if (initFirebase()) {
    const params = new URLSearchParams(window.location.search);
    targetCafeId = params.get('cafe');
    targetTableId = params.get('table');

    if (!targetCafeId) {
      document.getElementById('cust-loading').innerHTML = `
        <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
        <div style="font-size:16px;font-weight:700;color:#dc2626;">Invalid QR Code</div>
        <p style="font-size:12px;color:#64748b;margin-top:4px;">Please scan the table QR code again or contact staff.</p>
      `;
      return;
    }

    try {
      if (!auth.currentUser) {
        await auth.signInAnonymously();
      }
    } catch(e) {
      console.warn("Anonymous login skipped:", e);
    }

    db.collection("cafes").doc(targetCafeId).onSnapshot((doc) => {
      if (doc.exists) {
        window.RESTAURANT_DATA = doc.data();
        window.RESTAURANT_DATA.cafeId = targetCafeId;

        // টেবিলে কোনো সক্রিয় অর্ডার চলছে কি না তা স্বয়ংক্রিয়ভাবে ডিটেক্ট করা
        const activeOrd = (window.RESTAURANT_DATA.orders || []).find(o => o.tableId === targetTableId && o.status !== 'completed');
        if (activeOrd) {
          activePlacedOrderId = activeOrd.id;
        }

        renderCustomerMenu();
      } else {
        document.getElementById('cust-loading').innerHTML = '<div style="color:#dc2626;font-weight:700;">Restaurant not found!</div>';
      }
    }, (err) => {
      console.error("Firestore fetch error:", err);
      db.collection("cafes").doc(targetCafeId).get().then((doc) => {
        if (doc.exists) {
          window.RESTAURANT_DATA = doc.data();
          window.RESTAURANT_DATA.cafeId = targetCafeId;
          renderCustomerMenu();
        }
      });
    });
  }
});
</script>
</body>
</html>
