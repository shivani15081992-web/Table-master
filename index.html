<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TableMaster Pro — Cloud Restaurant Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --primary: #2563eb;
  --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  --bg: #f8fafc;
  --surface: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --reserved: #8b5cf6;
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06);
  --shadow-md: 0 8px 24px -4px rgba(15,23,42,0.08);
  --gold: #c9a961;
  --gold-dark: #8b6d38;
  --gold-light: #e8d5a1;
  --cream: #faf7f0;
  --cream-border: #ebe3d2;
  --charcoal: #1a1a1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text-main); font-size: 14px; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }

.auth-wrap { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at top left, #1e293b 0%, #0f172a 60%), #0f172a; }
.auth-card { background: #fff; padding: 28px 22px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); }
.auth-brand { text-align: center; margin-bottom: 20px; }
.auth-brand .icon-logo { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border: 1.5px solid var(--gold); box-shadow: 0 4px 14px rgba(201,169,97,0.3); }
.auth-tabs { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 12px; margin-bottom: 18px; }
.auth-tab { flex: 1; padding: 8px; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 13px; cursor: pointer; }
.auth-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }

.topbar { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
.brand-box { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; color: var(--primary); }
.brand-icon { width: 34px; height: 34px; background: #1a1a1a; border: 1px solid var(--gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.sync-badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.sync-badge.online { background: #dcfce7; color: #15803d; }
.sync-badge.syncing { background: #fef3c7; color: #b45309; }
.role-badge { font-size: 10.5px; padding: 3px 7px; border-radius: 6px; font-weight: 800; background: #ede9fe; color: #6d28d9; text-transform: uppercase; }
.lang-toggle-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px; border: 1px solid var(--border); background: #fff; font-size: 11px; font-weight: 700; color: var(--primary); cursor: pointer; }
.btn-icon { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; }

.main-wrapper { flex: 1; padding: 14px; padding-bottom: calc(90px + env(safe-area-inset-bottom)); max-width: 900px; margin: 0 auto; width: 100%; }
.tm-card { background: var(--surface); border-radius: var(--radius-xl); padding: 16px; box-shadow: var(--shadow-md); border: 1px solid rgba(226, 232, 240, 0.8); margin-bottom: 14px; }
.tm-card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-weight: 700; font-size: 14.5px; }

.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 600px) { .quick-grid { grid-template-columns: repeat(4, 1fr); } }
.quick-tile { background: var(--surface); border-radius: var(--radius-lg); padding: 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; cursor: pointer; border-left: 4px solid var(--primary); }
.quick-tile.amber { border-left-color: var(--warning); }
.quick-tile.emerald { border-left-color: var(--success); }
.quick-tile.purple { border-left-color: #8b5cf6; }
.tile-bubble { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #eff6ff; color: var(--primary); }
.quick-tile.amber .tile-bubble { background: #fffbeb; color: var(--warning); }
.quick-tile.emerald .tile-bubble { background: #ecfdf5; color: var(--success); }
.quick-tile.purple .tile-bubble { background: #f3e8ff; color: #8b5cf6; }
.tile-title { font-weight: 700; font-size: 13.5px; }
.tile-desc { font-size: 11px; color: var(--text-muted); }

.table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.table-card { background: #fff; border: 2px solid var(--border); border-radius: var(--radius-md); padding: 12px 10px; text-align: center; cursor: pointer; position: relative; }
.table-card.available { border-color: #a7f3d0; background: linear-gradient(180deg, #ecfdf5 0%, #fff 100%); }
.table-card.occupied { border-color: #fde68a; background: linear-gradient(180deg, #fffbeb 0%, #fff 100%); }
.table-card.reserved { border-color: #ddd6fe; background: linear-gradient(180deg, #f5f3ff 0%, #fff 100%); }
.table-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; }
.table-card.available .table-dot { background: var(--success); }
.table-card.occupied .table-dot { background: var(--warning); animation: pulse 1.4s infinite; }
.table-card.reserved .table-dot { background: var(--reserved); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.cat-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn { padding: 6px 14px; border-radius: 99px; background: #f1f5f9; border: none; font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
.cat-btn.active { background: var(--primary-gradient); color: #fff; }
.dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.dish-card { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-height: 80px; }
.dish-name { font-weight: 600; font-size: 13px; line-height: 1.3; }
.dish-price { font-weight: 800; color: var(--primary); margin-top: 4px; font-size: 13.5px; }

.floating-cart { position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 12px; right: 12px; background: var(--text-main); color: #fff; border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(15,23,42,0.3); z-index: 95; }
.btn-place { background: var(--success); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
.qty-ctrl-box { display: flex; align-items: center; gap: 6px; background: #f1f5f9; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); }
.qty-btn { background: #fff; border: 1px solid var(--border); width: 26px; height: 26px; border-radius: 4px; font-weight: 800; font-size: 14px; color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.qty-display { font-size: 12.5px; font-weight: 700; min-width: 18px; text-align: center; }

.profit-banner { padding: 16px; border-radius: var(--radius-lg); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.profit-banner.profit { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-left: 4px solid #059669; }
.profit-banner.loss { background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%); border-left: 4px solid #dc2626; }
.profit-banner .label { font-size: 11px; font-weight: 800; text-transform: uppercase; }
.profit-banner.profit .label { color: #047857; }
.profit-banner.loss .label { color: #b91c1c; }
.profit-banner .val { font-size: 26px; font-weight: 800; }
.profit-banner.profit .val { color: #065f46; }
.profit-banner.loss .val { color: #991b1b; }
.profit-breakdown { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; }
.profit-breakdown div { display: flex; flex-direction: column; }
.profit-breakdown span:first-child { color: #64748b; font-weight: 700; font-size: 9.5px; text-transform: uppercase; }
.profit-breakdown span:last-child { font-size: 13.5px; font-weight: 800; margin-top: 1px; }

.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filter-chip { padding: 5px 12px; border-radius: 99px; background: #f1f5f9; border: none; font-size: 11.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.filter-chip.active { background: var(--primary-gradient); color: #fff; }
.custom-date-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
.bar-label { flex: 0 0 38%; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 7px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--primary-gradient); }
.bar-fill.green { background: linear-gradient(90deg, #10b981, #059669); }
.bar-val { flex: 0 0 auto; font-size: 11.5px; font-weight: 700; text-align: right; min-width: 65px; }

.table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
.data-table th, .data-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; }
.data-table th { background: #f8fafc; font-weight: 700; color: var(--text-muted); font-size: 10.5px; text-transform: uppercase; }
.badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.badge.cat-raw { background: #fee2e2; color: #b91c1c; }
.badge.cat-sal { background: #e0e7ff; color: #4338ca; }

.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 6px 2px calc(6px + env(safe-area-inset-bottom)); }
.bar-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: none; font-size: 9.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 8px; flex: 1; }
.bar-item.active { color: var(--primary); background: #eff6ff; }
.bar-item svg { width: 18px; height: 18px; }

.dev-footer { text-align: center; padding: 14px 10px; font-size: 11.5px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 20px; }
.dev-footer b { color: var(--primary); font-weight: 800; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
.sheet-backdrop.active { display: flex; }
.sheet-modal { background: #fff; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 18px; max-height: 85dvh; overflow-y: auto; display: flex; flex-direction: column; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-title { font-size: 16px; font-weight: 800; }
.btn-x { background: #f1f5f9; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }

input, select, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13.5px; margin-bottom: 10px; background: #fff; }
label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
.btn-primary { width: 100%; background: var(--primary-gradient); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.btn-danger { background: var(--danger); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn-sm-outline { border: 1px solid var(--border); background: #fff; padding: 5px 10px; border-radius: 6px; font-weight: 700; font-size: 11.5px; cursor: pointer; }

.receipt-paper { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: #fff; color: #000; padding: 12px; border: 1px dashed #cbd5e1; border-radius: 8px; width: 280px; margin: 0 auto; text-align: left; line-height: 1.35; }
.receipt-paper hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
.receipt-paper .c { text-align: center; }
.receipt-paper .qr-img { width: 100px; height: 100px; display: block; margin: 0 auto; }
.receipt-logo { max-width: 80px; max-height: 50px; display: block; margin: 0 auto 4px; filter: grayscale(100%); }

@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; display: block !important; }
  #print-area .receipt-paper { width: 100% !important; max-width: 80mm !important; border: none !important; margin: 0 auto !important; }
  #print-area .table-qr-card { width: 100% !important; max-width: 90mm !important; border: 1.5px solid #333 !important; page-break-inside: avoid; margin: 4mm auto !important; padding: 8mm !important; }
  #print-area .qr-big-img { width: 55mm !important; height: 55mm !important; }
  @page { margin: 0; }
}
#print-area { display: none; }

.table-qr-card { width: 100%; max-width: 320px; background: #fff; border: 2px dashed #94a3b8; border-radius: 12px; padding: 16px; margin: 0 auto; text-align: center; }
.qr-cafe-name { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 2px; }
.qr-table-name { font-size: 24px; font-weight: 800; color: #2563eb; margin-bottom: 10px; }
.qr-big-img { width: 200px; height: 200px; display: block; margin: 0 auto 10px; image-rendering: pixelated; }
.qr-instructions { background: #f8fafc; border-radius: 8px; padding: 8px 10px; text-align: left; line-height: 1.5; font-size: 10.5px; border: 1px solid #e2e8f0; }

.backup-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.bill-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }

/* Customer Self-Order Mode */
#customer-screen { display: none; min-height: 100dvh; background: var(--cream); flex-direction: column; }
body.customer-mode { background: var(--cream); }
.customer-hero {
  background: radial-gradient(circle at 15% 10%, rgba(201,169,97,0.15) 0%, transparent 45%),
    linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
  color: #fff; padding: 28px 20px 24px; padding-top: calc(28px + env(safe-area-inset-top)); text-align: center; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.customer-logo-circle { width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 50%; border: 1.5px solid rgba(201,169,97,0.5); background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; }
.customer-cafe-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; background: linear-gradient(135deg, #e8d5a1, #c9a961); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.customer-divider { display: flex; align-items: center; gap: 10px; margin: 10px auto 12px; max-width: 180px; color: #c9a961; font-size: 8px; }
.customer-divider span { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,169,97,0.6), transparent); }
.customer-table-badge { display: inline-block; padding: 5px 16px; border: 1px solid rgba(201,169,97,0.4); border-radius: 100px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #e8d5a1; font-weight: 600; }
.customer-main { flex: 1; padding: 16px; padding-bottom: 110px; max-width: 800px; margin: 0 auto; width: 100%; }
.customer-search-wrap { position: relative; margin-bottom: 14px; }
.customer-search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #8b6d38; }
.customer-search-input { width: 100%; padding: 12px 14px 12px 40px; background: #fff; border: 1px solid var(--cream-border); border-radius: 100px; font-size: 13px; color: #1a1a1a; margin: 0; }
.customer-cats-wrap { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; scrollbar-width: none; }
.customer-cat-btn { padding: 8px 18px; border-radius: 100px; background: transparent; border: 1px solid #d4c5a8; color: #6b5540; font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.customer-cat-btn.active { background: #1a1a1a; color: #e8d5a1; border-color: #1a1a1a; }
.customer-dish-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .customer-dish-grid { grid-template-columns: repeat(2, 1fr); } }
.customer-dish-card { background: #fff; border-radius: 14px; padding: 14px 16px; border: 1px solid var(--cream-border); box-shadow: 0 1px 4px rgba(139,109,56,0.06); cursor: pointer; }
.cdc-category { font-size: 9px; font-weight: 700; color: #8b6d38; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
.cdc-name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 600; color: #1a1a1a; }
.cdc-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
.cdc-price { font-size: 15px; font-weight: 800; color: #8b6d38; }
.cdc-add-btn { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1a1a1a, #2d2d2d); color: #e8d5a1; border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.customer-cart-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent 0%, var(--cream) 40%); }
.customer-cart { background: linear-gradient(135deg, #1a1a1a, #2d2d2d); color: #fff; border-radius: 18px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(201,169,97,0.3); }
.ccb-btn { background: linear-gradient(135deg, #c9a961, #e8d5a1); color: #1a1a1a; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 800; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="icon-logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e8d5a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
        </svg>
      </div>
      <h2 style="font-size:20px;font-weight:800;color:#0f172a">TableMaster Pro</h2>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:2px">Enterprise Cloud POS & Table Management</p>
    </div>
    <div id="firebase-error-box" style="display:none; background:#fef2f2; border:1px solid #fecaca; color:#dc2626; padding:10px; border-radius:8px; font-size:12px; font-weight:600; margin-bottom:15px; text-align:center;">
      ⚠️ Firebase failed to load! Please check your connection or whitelist the domain.
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" type="button" onclick="switchAuthTab('login')" id="tab-login">Login</button>
      <button class="auth-tab" type="button" onclick="switchAuthTab('register')" id="tab-register">Register Cafe</button>
    </div>
    <form id="form-login" onsubmit="handleLogin(event)">

const firebaseConfig = {

let auth = null;
let db = null;
let currentCafeListener = null;

function initFirebaseApp() {
  try {
    if (typeof firebase !== 'undefined') {
      if (!firebase.apps || !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();
      return true;
    } else {
      const box = document.getElementById('firebase-error-box');
      if (box) box.style.display = 'block';
      return false;
    }
  } catch(e) {
    console.warn('Firebase init error:', e);
    const box = document.getElementById('firebase-error-box');
    if (box) box.style.display = 'block';
    return false;
  }
}

window.todayStr = function() {
  return new Intl.DateTimeFormat('en-CA', {

    cafeId, ownerUid, name, ownerName: owner, phone,
    address: 'City, State', masterPin: pin, upi: 'pay@upi', googleReview: '',

window.RESTAURANT_DATA = {
  cafeId: 'default_cafe', name: 'TableMaster Bistro', phone: '', address: '',
  masterPin: '1234', gstRate: 0, serviceRate: 0,
  tables: [{ id: 't1', name: 'T-01', seats: 4, status: 'available', booking: null }],

  ],
  platformPayouts: [], orders: [], expenses: [], staff: []
};

window.CURRENT_USER_ROLE = sessionStorage.getItem('tmpro_role_mode') || 'owner';
window.getData = function() { return window.RESTAURANT_DATA || {}; };

function bindCafeCloudListener(cafeId) {
  if (!db || !cafeId) return;
  if (currentCafeListener) { try { currentCafeListener(); } catch(e){} }

  const badge = document.getElementById('sync-status');
  if (badge) { badge.className = 'sync-badge syncing'; badge.innerHTML = '🔄 Connecting...'; }

  currentCafeListener = db.collection("cafes").doc(cafeId).onSnapshot((docSnap) => {
    if (docSnap.exists) {
      window.RESTAURANT_DATA = Object.assign({}, window.RESTAURANT_DATA, docSnap.data());
      window.RESTAURANT_DATA.cafeId = cafeId;
      try { localStorage.setItem('tmpro_cafe_cache_' + cafeId, JSON.stringify(window.RESTAURANT_DATA)); } catch(e){}
    }
    if (badge) { badge.className = 'sync-badge online'; badge.innerHTML = '☁️ Online'; }
    renderCurrentView();
  }, (err) => {
    console.warn("Firestore sync warning:", err);
    if (badge) { badge.className = 'sync-badge syncing'; badge.innerHTML = '⚡ Local Mode'; }
    renderCurrentView();
  });
}

window.cloudSave = function() {
  const data = window.getData();
  if (!data || !data.cafeId || !db) return;
  try { localStorage.setItem('tmpro_cafe_cache_' + data.cafeId, JSON.stringify(data)); } catch(e){}
  const badge = document.getElementById('sync-status');
  if (badge) { badge.className = 'sync-badge syncing'; badge.innerHTML = '🔄 Syncing...'; }

  db.collection("cafes").doc(data.cafeId).set(data, { merge: true }).then(() => {
    if (badge) { badge.className = 'sync-badge online'; badge.innerHTML = '☁️ Online'; }
  }).catch(err => {
    console.error("Cloud save failed:", err);
    if (badge) { badge.className = 'sync-badge syncing'; badge.innerHTML = '⚠️ Error'; }
  });
};

/* ==========================================================================
   AUTHENTICATION
   ========================================================================== */
function checkAuth() {
  if (!auth) { setTimeout(checkAuth, 500); return; }

  auth.onAuthStateChanged(async (user) => {
    if (window.IS_CUSTOMER_MODE) return;

    if (user) {
      let cafeId = 'cafe_' + user.uid;
      let userRole = 'owner';

      try {
        const userDoc = await db.collection("users").doc(user.uid).get();
        if (userDoc.exists) {
          const ud = userDoc.data();
          cafeId = ud.cafeId || cafeId;
          userRole = ud.role || 'owner';
        }
      } catch(e) { console.warn("User role fetch warning:", e.message); }

      window.CURRENT_USER_ROLE = userRole;
      sessionStorage.setItem('tmpro_role_mode', userRole);

      const cached = localStorage.getItem('tmpro_cafe_cache_' + cafeId);
      if (cached) {
        try { window.RESTAURANT_DATA = JSON.parse(cached); } catch(e){}
      }
      window.RESTAURANT_DATA.cafeId = cafeId;

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';

      document.querySelectorAll('.owner-only').forEach(el => {
        el.style.display = (userRole === 'owner') ? 'flex' : 'none';
      });

      bindCafeCloudListener(cafeId);
      setupNavigation();
      renderCurrentView();
    } else {
      if (currentCafeListener) { try { currentCafeListener(); } catch(e){} currentCafeListener = null; }
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';
    }
  });
}

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
}

async function handleLogin(e) {
  e.preventDefault();
  if (!auth) { alert("⚠️ Firebase load error. Check internet connection."); return; }
  let loginInput = document.getElementById('log-email').value.trim().toLowerCase();
  const pass = document.getElementById('log-pass').value;
  const btn = document.getElementById('btn-login-submit');
  btn.disabled = true; btn.innerText = "Signing in...";

  let targetEmail = loginInput.includes('@') ? loginInput : loginInput.replace(/\s+/g, '') + '@tablemaster.com';

  try {
    await auth.signInWithEmailAndPassword(targetEmail, pass);
  } catch (err) {
    if (!loginInput.includes('@') && (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found')) {
      try {
        const fallbackEmail = loginInput.replace(/\s+/g, '') + '@tablemaster.local';
        await auth.signInWithEmailAndPassword(fallbackEmail, pass);
        return;
      } catch (fallbackErr) {
        alert(currentLang === 'bn' ? "লগইন ব্যর্থ: ইউজারনেম অথবা পাসওয়ার্ড সঠিক নয়।" : "Login Failed: Invalid credentials.");
      }
    } else {
      alert("Login Failed: " + err.message);
    }
  } finally {
    btn.disabled = false; btn.innerText = "Sign In →";
  }
}

async function handleRegister(e) {
  e.preventDefault();
  if (!auth || !db) { alert("⚠️ Firebase not initialized."); return; }

  const name = document.getElementById('reg-name').value.trim();
  const owner = document.getElementById('reg-owner').value.trim();
  const phone = document.getElementById('reg-phone').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value.trim();
  const pin = document.getElementById('reg-pin').value.trim();
  const btn = document.getElementById('btn-reg-submit');

  btn.disabled = true; btn.innerText = "Registering Cafe...";

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const cafeId = 'cafe_' + uid;

    const newCafe = createNewCafeTemplate(cafeId, uid, name, owner, phone, pin);
    window.RESTAURANT_DATA = newCafe;

    await db.collection("cafes").doc(cafeId).set(newCafe);
    localStorage.setItem('tmpro_cafe_cache_' + cafeId, JSON.stringify(newCafe));
    alert(`✓ Registration Successful for "${name}"!`);
  } catch (err) {
    alert("Registration Error: " + err.message);
  } finally {
    btn.disabled = false; btn.innerText = "Register & Launch My Cafe →";
  }
}

async function handleLogout() {
  if (!confirm(currentLang === 'bn' ? 'লগআউট করতে চান?' : 'Log out from your Cafe account?')) return;
  try {
    window.CURRENT_USER_ROLE = 'owner';
    sessionStorage.removeItem('tmpro_role_mode');
    if (auth) await auth.signOut();
  } catch (err) { console.error(err); }
}

   ========================================================================== */
function openSheet(title, html) {
  document.getElementById('sheet-title').innerText = title;
  document.getElementById('sheet-body').innerHTML = html;
  document.getElementById('sheet-backdrop').classList.add('active');
}
function closeSheet() { document.getElementById('sheet-backdrop').classList.remove('active'); }
function sheetBackdropClick(e) { if (e.target.id === 'sheet-backdrop') closeSheet(); }

function createSafeQR(text) {
  if (!text) return '';
  try {
    const qr = qrcode(0, 'M');
    qr.addData(String(text));
    qr.make();
    return qr.createDataURL(4);
  } catch (err) { return ''; }
}

  if (!bottomBar) return;
  const allowed = ALL_NAV_ITEMS.filter(it => !it.roles || it.roles.includes(role));
  bottomBar.innerHTML = allowed.map(it => `
    <button class="bar-item ${activeTab === it.id ? 'active' : ''}" onclick="navigate('${it.id}')" id="nav-${it.id}">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${it.icon}</svg>

function openAddTableSheet() {
  const form = `
    <label>${t('table')} Name</label>
    <input type="text" id="tbl-in-name" placeholder="e.g. Table 5 / T-05">
    <label>${t('seater')} Capacity</label>
    <input type="number" id="tbl-in-seats" value="4" min="1">
    <button class="btn-primary" onclick="saveNewTable()">${t('save')}</button>
  `;
  openSheet(t('addTable'), form);
}

function saveNewTable() {
  const data = window.getData();
  const name = document.getElementById('tbl-in-name').value.trim();
  const seats = parseInt(document.getElementById('tbl-in-seats').value) || 4;
  if (!name) return;
  if (!data.tables) data.tables = [];
  data.tables.push({ id: 't_' + Date.now(), name, seats, status: 'available', booking: null });
  window.cloudSave(); closeSheet(); renderCurrentView();
}

function openEditTableSheet(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;

  const form = `
    <label>${t('table')} Name</label>
    <input type="text" id="tbl-edit-name" value="${tbl.name}">
    <label>${t('seater')} Capacity</label>
    <input type="number" id="tbl-edit-seats" value="${tbl.seats}" min="1">
    <button class="btn-primary" onclick="saveEditTable('${tableId}')">${t('save')}</button>
    <button class="btn-danger" style="width:100%;margin-top:8px;padding:9px;" onclick="deleteTable('${tableId}')">${t('delete')}</button>
  `;
  openSheet(t('editTable') + ' — ' + tbl.name, form);
}

function saveEditTable(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;
  const name = document.getElementById('tbl-edit-name').value.trim();
  const seats = parseInt(document.getElementById('tbl-edit-seats').value) || 4;
  if (!name) return;
  tbl.name = name;
  tbl.seats = seats;
  window.cloudSave(); closeSheet(); renderCurrentView();
}

function deleteTable(tableId) {
  const data = window.getData();
  if (!confirm(t('confirmDelete'))) return;
  data.tables = (data.tables || []).filter(t => t.id !== tableId);
  window.cloudSave(); closeSheet(); renderCurrentView();
}

function openBookingSheet(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;

  const b = tbl.booking || {};
  const isBooked = tbl.status === 'reserved';

  const form = `
    <div style="font-weight:700;margin-bottom:10px;">${tbl.name} (${tbl.seats} ${t('seater')})</div>
    <label>${t('customerName')}</label>
    <input type="text" id="bk-name" value="${b.name || ''}" placeholder="e.g. Rahul Sen">
    <label>${t('phone')}</label>
    <input type="text" id="bk-phone" value="${b.phone || ''}" placeholder="e.g. 9876543210">
    <label>${t('bookingTime')}</label>
    <input type="text" id="bk-time" value="${b.time || ''}" placeholder="e.g. 8:30 PM (4 Persons)">
    <button class="btn-primary" onclick="saveTableBooking('${tableId}')">${t('reserve')}</button>
    ${isBooked ? `
      <button class="btn-danger" style="width:100%;margin-top:8px;padding:9px;" onclick="releaseTableBooking('${tableId}')">${t('releaseBooking')}</button>
    ` : ''}
  `;
  openSheet(t('bookTable') + ' — ' + tbl.name, form);
}

function saveTableBooking(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;
  const name = document.getElementById('bk-name').value.trim();
  const phone = document.getElementById('bk-phone').value.trim();
  const time = document.getElementById('bk-time').value.trim();

  if (!name) { alert('Please enter Customer Name'); return; }
  tbl.booking = { name, phone, time, date: window.todayStr() };
  tbl.status = 'reserved';
  window.cloudSave(); closeSheet(); renderCurrentView();
}

function releaseTableBooking(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;
  tbl.booking = null;
  tbl.status = 'available';
  window.cloudSave(); closeSheet(); renderCurrentView();
}

   EDIT RUNNING BILL (FIXED & FULLY DYNAMIC)
   ========================================================================== */
function openEditRunningOrderSheet(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;
  if (o.status === 'completed') { alert('Completed orders cannot be edited.'); return; }

  const html = `
    <div style="background:#fef3c7;border:1px solid #fde68a;padding:10px;border-radius:8px;margin-bottom:12px;font-size:11.5px;color:#92400e;">
      ⚠️ ${t('editBillNotice')}
    </div>
    <div style="font-weight:800;margin-bottom:10px;font-size:14px;">Bill #${o.billNo} — ${t('editItemsTitle')}</div>
    <div style="margin-bottom:14px;">
      ${o.items.map((it, idx) => `
        <div class="bill-item-row">
          <div style="flex:1;">
            <div style="font-weight:700;font-size:13px;">${it.name}</div>
            <div style="font-size:11px;color:#64748b;">₹ ${it.price} × ${it.qty} = ₹ ${(it.price * it.qty).toFixed(2)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="qty-btn" onclick="editOrderItemQty('${orderId}', ${idx}, -1)">−</button>
            <b style="min-width:16px;text-align:center;">${it.qty}</b>
            <button class="qty-btn" onclick="editOrderItemQty('${orderId}', ${idx}, 1)">+</button>
            <button class="btn-danger" style="padding:4px 8px;font-size:10px;" onclick="removeItemFromOrder('${orderId}', ${idx})">🗑️</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div style="text-align:right;font-size:15px;font-weight:800;padding-top:8px;border-top:1px dashed var(--border);">
      ${t('newTotal')}: <span style="color:var(--primary);">₹ ${o.total.toFixed(2)}</span>
    </div>
  `;
  openSheet('Edit Bill #' + o.billNo, html);
}

function recalcOrderTotals(o) {
  o.subtotal = o.items.reduce((s, i) => s + i.price * i.qty, 0);
  const gstRate = o.gstRate || 0, serviceRate = o.serviceRate || 0;
  o.gst = gstRate > 0 ? o.subtotal * (gstRate / 100) : 0;
  o.service = serviceRate > 0 ? o.subtotal * (serviceRate / 100) : 0;
  o.total = o.subtotal + o.gst + o.service;
}

function editOrderItemQty(orderId, idx, change) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o || !o.items[idx]) return;
  o.items[idx].qty += change;
  if (o.items[idx].qty <= 0) o.items.splice(idx, 1);
  if (o.items.length === 0) {
    if (confirm('All items removed. Cancel order?')) {
      data.orders = data.orders.filter(ord => ord.id !== orderId);
      const tbl = (data.tables || []).find(t => t.id === o.tableId);
      if (tbl) tbl.status = 'available';
      window.cloudSave(); closeSheet(); renderCurrentView();
    }
    return;
  }
  recalcOrderTotals(o);
  window.cloudSave();
  openEditRunningOrderSheet(orderId);
  renderCurrentView();
}

function removeItemFromOrder(orderId, idx) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;
  if (!confirm('Remove this item?')) return;
  o.items.splice(idx, 1);
  if (o.items.length === 0) {
    data.orders = data.orders.filter(ord => ord.id !== orderId);
    const tbl = (data.tables || []).find(t => t.id === o.tableId);
    if (tbl) tbl.status = 'available';
    window.cloudSave(); closeSheet(); renderCurrentView();
    return;
  }
  recalcOrderTotals(o);
  window.cloudSave();
  openEditRunningOrderSheet(orderId);
  renderCurrentView();
}

function handleTableSelect(tblId) { cartState.tableId = tblId; navigate('pos'); }

function addItemToCart(dishId) {
  const data = window.getData();
  const dish = (data.menu || []).find(d => d.id === dishId);
  if (!dish) return;
  const item = cartState.items.find(i => i.dishId === dishId);
  if (item) item.qty += 1;
  else cartState.items.push({ dishId, name: dish.name, price: dish.price, qty: 1 });

}

function openCartReviewSheet() {
  const data = window.getData();
  if (!cartState.tableId) { alert(t('selectDishWarning')); return; }
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const gstRate = parseFloat(data.gstRate) || 0;
  const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
  const grandTotal = subtotal + gst;

  const body = `
    <div style="font-weight:700;margin-bottom:10px;">${t('table')}: Selected</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
      ${cartState.items.map((it, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div><b>${it.name}</b><br><small>₹ ${it.price}</small></div>
          <b>${it.qty}x</b>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:14px;">
      <span>${t('grandTotal')}:</span><span>₹ ${grandTotal.toFixed(2)}</span>
    </div>
    <button class="btn-primary" onclick="submitOrderToKitchen()">${t('sendToKitchen')}</button>
  `;
  openSheet(t('orderConfirmation'), body);
}

function submitOrderToKitchen() {
  const data = window.getData();
  if (!data.orders) data.orders = [];
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const gstRate = parseFloat(data.gstRate) || 0;
  const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
  const orderNum = 100 + data.orders.length + 1;

  data.orders.push({
    id: 'ord_' + Date.now(), kotNo: orderNum, billNo: orderNum, tableId: cartState.tableId,
    items: cartState.items, subtotal, gst, gstRate,
    total: subtotal + gst, status: 'preparing',
    date: window.todayStr()
  });

  const tbl = (data.tables || []).find(tData => tData.id === cartState.tableId);
  if (tbl) tbl.status = 'occupied';

  window.cloudSave();
  cartState = { tableId: '', items: [] };
  closeSheet();
  navigate('kitchen');
}

function completeKOT(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (o) { o.status = 'ready_to_serve'; window.cloudSave(); renderCurrentView(); }
}

function markOrderServed(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (o) { o.status = 'served'; window.cloudSave(); renderCurrentView(); }
}

function settleBillAndReleaseTable(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;
  if (!confirm(`Settle ₹ ${o.total.toFixed(2)} for Bill #${o.billNo}?`)) return;
  o.status = 'completed';
  const tbl = (data.tables || []).find(tData => tData.id === o.tableId);
  if (tbl) { tbl.status = 'available'; tbl.booking = null; }
  window.cloudSave();
  renderCurrentView();
}

        <img src="${qrImg}" class="qr-big-img">
        <div style="font-size:11px;color:#64748b;">${tbl.seats} Seater Table</div>
      </div>
    `;
  }).join('');
  openSheet(t('allQR'), cardsHtml);
}

function showTableQR(tableId) {
  const data = window.getData();
  const tbl = (data.tables || []).find(t => t.id === tableId);
  if (!tbl) return;
  const url = `${window.location.origin}${window.location.pathname}?mode=customer&cafe=${data.cafeId}&table=${tbl.id}`;
  const qrImg = createSafeQR(url);
  const html = `
    <div class="table-qr-card">
      <div class="qr-cafe-name">${data.name}</div>
      <div class="qr-table-name">${tbl.name}</div>
      <img src="${qrImg}" class="qr-big-img">
      <div style="font-size:11px;color:#64748b;">${tbl.seats} ${t('seater')}</div>
    </div>
  `;
  openSheet('QR — ' + tbl.name, html);
}

/* ==========================================================================
   INITIALIZATION & PWA SERVICE WORKER
   ========================================================================== */
function routeBasedOnUrl() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('mode') === 'customer') {
    // Customer mode
    window.IS_CUSTOMER_MODE = true;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('customer-screen').style.display = 'flex';
  } else {
    checkAuth();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration skipped', err));
  }
  if (initFirebaseApp()) {
    routeBasedOnUrl();
  }
});
</script>
