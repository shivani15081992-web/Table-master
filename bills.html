<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bills Management & Print — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" id="header-logo-container"></div>
      <div>
        <span id="txt-cafe-name">Bills Management</span>
        <div id="active-user-role" class="role-badge">BILLS</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Connecting...</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage(renderBills)">🌐 <span id="lbl-lang">English</span></button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="main-wrapper">
    <div class="tm-card">
      <div class="tm-card-title">
        <span>Order Bills Ledger</span>
        <small style="color:var(--text-muted);font-weight:600;" id="bills-count-info">0 Bills</small>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;">
        <button class="btn-sm-outline active" id="chip-today" onclick="setBillFilter('today')">Today</button>
        <button class="btn-sm-outline" id="chip-unpaid" onclick="setBillFilter('unpaid')">Unpaid Only</button>
        <button class="btn-sm-outline" id="chip-ready" onclick="setBillFilter('ready')">Ready to Settle</button>
        <button class="btn-sm-outline" id="chip-all" onclick="setBillFilter('all')">All Time</button>
      </div>

      <!-- BILLS LIST -->
      <div id="bills-ledger-list" style="display:flex;flex-direction:column;gap:10px;margin-top:10px;"></div>
    </div>
  </main>

  <div id="print-area"></div>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-bar">
    <a href="index.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 011 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Home</span>
    </a>
    <a href="pos.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      <span>Order</span>
    </a>
    <a href="kitchen.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
      <span>Kitchen</span>
    </a>
    <a href="bills.html" class="bar-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <span>Bills</span>
    </a>
    <a href="menu.html" class="bar-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      <span>Menu</span>
    </a>
  </nav>

  <!-- MODAL SHEET -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
    <div class="sheet-modal">
      <div class="sheet-head">
        <div class="sheet-title" id="sheet-title">Bill Action</div>
        <button class="btn-x" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script>
let currentBillFilter = 'today';
let activeCafeId = '';

function handleLogout() {
  if (confirm("Log out from Bills Terminal?")) {
    sessionStorage.clear();
    auth.signOut().then(() => {
      window.location.href = 'index.html';
    });
  }
}

function setBillFilter(filter) {
  currentBillFilter = filter;
  document.getElementById('chip-today').classList.toggle('active', filter === 'today');
  document.getElementById('chip-unpaid').classList.toggle('active', filter === 'unpaid');
  document.getElementById('chip-ready').classList.toggle('active', filter === 'ready');
  document.getElementById('chip-all').classList.toggle('active', filter === 'all');
  renderBills();
}

function getChannelName(tId, data) {
  if (tId && tId.startsWith('plt_')) {
    const p = (data.platforms || []).find(x => x.id === tId);
    return p ? '🛵 ' + p.name : '🛵 Online';
  }
  if (tId === 'takeaway') return '🛍️ Takeaway';
  const tbl = (data.tables || []).find(t => t.id === tId);
  return tbl ? '🪑 ' + tbl.name : 'Channel: ' + tId;
}

function getStatusBadge(status) {
  if (status === 'completed') {
    return '<span class="badge cat-sal">PAID ✓</span>';
  }
  if (status === 'served') {
    return '<span class="badge" style="background:#dcfce7;color:#15803d;border:1px solid #86efac;">FOOD SERVED</span>';
  }
  if (status === 'ready_to_serve') {
    return '<span class="badge" style="background:#ffedd5;color:#c2410c;border:1px solid #fdba74;">AWAITING SERVE</span>';
  }
  return '<span class="badge" style="background:#fef3c7;color:#b45309;border:1px solid #fde68a;">COOKING (KOT)</span>';
}

function renderBills() {
  const data = window.getData();
  updateHeaderBrand(data);
  document.getElementById('lbl-lang').innerText = currentLang === 'en' ? 'English' : 'বাংলা';

  const today = window.todayStr();
  let orders = [...(data.orders || [])].sort((a,b) => (b.kotNo||0) - (a.kotNo||0));

  if (currentBillFilter === 'today') {
    orders = orders.filter(o => o.date === today);
  } else if (currentBillFilter === 'unpaid') {
    orders = orders.filter(o => o.status !== 'completed');
  } else if (currentBillFilter === 'ready') {
    orders = orders.filter(o => o.status === 'served');
  }

  document.getElementById('bills-count-info').innerText = `${orders.length} Bills`;
  const container = document.getElementById('bills-ledger-list');

  if (orders.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:28px 16px;color:var(--text-muted);font-weight:600;">No bills found for this filter.</div>';
    return;
  }

  container.innerHTML = orders.map(o => {
    const isSettled = o.status === 'completed';
    const isServed = o.status === 'served';
    const isTakeawayOrOnline = o.tableId === 'takeaway' || (o.tableId && o.tableId.startsWith('plt_'));

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--shadow-sm);">
        <div style="flex:1;">
          <div style="font-weight:700;">#Bill-${o.billNo} — ${getChannelName(o.tableId, data)}
            ${getStatusBadge(o.status)}
            ${o.source === 'customer_qr' ? '<span class="badge" style="background:#ede9fe;color:#6d28d9;margin-left:2px;">📱 QR</span>' : ''}
          </div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">
            📅 ${o.date} ${o.time || ''} · ${(o.items||[]).length} items · <b>₹ ${(o.total||0).toFixed(2)}</b>
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center;">
          <button class="btn-sm-outline" onclick="showReceiptSheet('${o.id}')">Receipt</button>
          ${!isSettled ? `
            <button class="btn-sm-outline" style="background:#fef3c7;color:#b45309;border-color:#fde68a;" onclick="openEditOrderSheet('${o.id}')">✏️ Edit</button>
            ${(isServed || isTakeawayOrOnline) ? `
              <button class="btn-primary" style="width:auto;padding:6px 12px;font-size:11.5px;background:#059669;" onclick="settleBill('${o.id}')">✓ Settle</button>
            ` : `
              <button class="btn-sm-outline" style="color:var(--text-muted);font-size:11px;cursor:not-allowed;" title="Wait until food is served at table" disabled>Wait Serve</button>
            `}
          ` : ''}
        </div>
      </div>
    `;
  }).join('');
}

async function settleBill(orderId) {
  if (!activeCafeId || !db) return;
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;
  if (!confirm(`Confirm settlement of ₹ ${(o.total||0).toFixed(2)} for Bill #${o.billNo}?`)) return;

  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const orders = cData.orders || [];
    const tables = cData.tables || [];

    const targetOrder = orders.find(ord => ord.id === orderId);
    if (targetOrder) targetOrder.status = 'completed';

    const targetTbl = tables.find(t => t.id === o.tableId);
    if (targetTbl) {
      targetTbl.status = 'available';
      targetTbl.booking = null;
    }

    await cafeRef.update({ orders, tables });
    renderBills();
  } catch(err) {
    alert("Settlement failed: " + err.message);
  }
}

function recalcOrder(o) {
  o.subtotal = o.items.reduce((s, i) => s + i.price * i.qty, 0);
  const gstRate = o.gstRate || 0;
  o.gst = gstRate > 0 ? (o.subtotal * (gstRate / 100)) : 0;
  o.total = o.subtotal + o.gst;
}

function openEditOrderSheet(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;

  const html = `
    <div style="background:#fef3c7;border:1px solid #fde68a;padding:10px;border-radius:8px;margin-bottom:12px;font-size:11.5px;color:#92400e;">
      ⚠️ ${t('editBillNotice')}
    </div>
    <div style="font-weight:800;margin-bottom:10px;font-size:14px;">Bill #${o.billNo} — ${t('editItemsTitle')}</div>
    <div style="margin-bottom:14px;">
      ${(o.items || []).map((it, idx) => `
        <div class="bill-item-row" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;">
          <div style="flex:1;">
            <div style="font-weight:700;font-size:13px;">${it.name}</div>
            <div style="font-size:11px;color:#64748b;">₹ ${it.price} × ${it.qty} = ₹ ${(it.price * it.qty).toFixed(2)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="qty-btn" onclick="editItemQty('${orderId}', ${idx}, -1)">−</button>
            <b style="min-width:16px;text-align:center;">${it.qty}</b>
            <button class="qty-btn" onclick="editItemQty('${orderId}', ${idx}, 1)">+</button>
            <button class="btn-danger" style="padding:4px 8px;font-size:10px;" onclick="removeItem('${orderId}', ${idx})">🗑️</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div style="text-align:right;font-size:15px;font-weight:800;padding-top:8px;border-top:1px dashed var(--border);">
      ${t('newTotal')}: <span style="color:var(--primary);">₹ ${(o.total||0).toFixed(2)}</span>
    </div>
  `;
  openSheet('Edit Bill #' + o.billNo, html);
}

async function editItemQty(orderId, idx, delta) {
  if (!activeCafeId || !db) return;
  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    let orders = cData.orders || [];
    let tables = cData.tables || [];
    const o = orders.find(ord => ord.id === orderId);
    if (!o || !o.items[idx]) return;

    o.items[idx].qty += delta;
    if (o.items[idx].qty <= 0) o.items.splice(idx, 1);

    if (o.items.length === 0) {
      if (confirm("All items removed. Cancel entire bill?")) {
        orders = orders.filter(ord => ord.id !== orderId);
        const tbl = tables.find(t => t.id === o.tableId);
        if (tbl) tbl.status = 'available';
        await cafeRef.update({ orders, tables });
        closeSheet(); renderBills();
        return;
      }
    }

    recalcOrder(o);
    await cafeRef.update({ orders });
    openEditOrderSheet(orderId);
    renderBills();
  } catch(err) {
    console.error("Edit item failed:", err);
  }
}

async function removeItem(orderId, idx) {
  if (!activeCafeId || !db) return;
  if (!confirm("Remove this item from the bill?")) return;
  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    let orders = cData.orders || [];
    let tables = cData.tables || [];
    const o = orders.find(ord => ord.id === orderId);
    if (!o) return;

    o.items.splice(idx, 1);
    if (o.items.length === 0) {
      orders = orders.filter(ord => ord.id !== orderId);
      const tbl = tables.find(t => t.id === o.tableId);
      if (tbl) tbl.status = 'available';
      await cafeRef.update({ orders, tables });
      closeSheet(); renderBills();
      return;
    }

    recalcOrder(o);
    await cafeRef.update({ orders });
    openEditOrderSheet(orderId);
    renderBills();
  } catch(err) {
    console.error("Remove item failed:", err);
  }
}

function showReceiptSheet(orderId) {
  const data = window.getData();
  const o = (data.orders || []).find(ord => ord.id === orderId);
  if (!o) return;

  const upiString = `upi://pay?pa=${data.upi}&pn=${encodeURIComponent(data.name)}&am=${(o.total||0).toFixed(2)}&cu=INR&tn=Bill-${o.billNo}`;
  const upiQrImg = createSafeQR(upiString);
  const reviewQrImg = (data.googleReview && data.googleReview.trim() !== '') ? createSafeQR(data.googleReview.trim()) : '';
  const logoToUse = (data.logo && data.logo.trim() !== '') ? data.logo : DEFAULT_GOLD_SVG_LOGO;

  const receiptHtml = `
    <div class="receipt-paper" id="paper-element">
      <div class="c" style="margin-bottom:6px;">
        <img src="${logoToUse}" class="receipt-logo" alt="Logo">
      </div>
      <div class="c" style="font-size:13px;font-weight:bold;">${data.name}</div>
      <div class="c" style="font-size:9.5px;">Ph: ${data.phone}</div>
      <div class="c" style="font-size:9.5px;">${data.address}</div>
      <hr>
      <div>Bill #: ${o.billNo} | Channel: ${getChannelName(o.tableId, data)}</div>
      <div>Date: ${o.date} ${o.time || ''}</div>
      <hr>
      ${(o.items||[]).map(i => `
        <div style="display:flex;justify-content:space-between;">
          <span>${i.name} x${i.qty}</span>
          <span>₹ ${(i.price * i.qty).toFixed(2)}</span>
        </div>
      `).join('')}
      <hr>
      <div style="display:flex;justify-content:space-between;">
        <span>Subtotal:</span><span>₹ ${(o.subtotal||o.total||0).toFixed(2)}</span>
      </div>
      ${o.gst > 0 ? `
        <div style="display:flex;justify-content:space-between;">
          <span>GST (${o.gstRate}%):</span><span>₹ ${o.gst.toFixed(2)}</span>
        </div>
      ` : ''}
      <hr>
      <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:12px;">
        <span>Grand Total:</span><span>₹ ${(o.total||0).toFixed(2)}</span>
      </div>

      <!-- UPI SCAN TO PAY QR -->
      ${upiQrImg ? `
        <div class="c" style="margin-top:6px;">
          <img src="${upiQrImg}" class="qr-img" alt="UPI QR">
          <div style="font-size:8.5px;margin-top:2px;font-weight:700;">Scan UPI to Pay</div>
        </div>
      ` : ''}

      <!-- GOOGLE REVIEW QR -->
      ${reviewQrImg ? `
        <hr>
        <div class="c" style="margin-top:4px;">
          <div style="font-size:8.5px;font-weight:700;">Rate Us on Google / আপনার রিভিউ দিন</div>
          <img src="${reviewQrImg}" style="width:70px;height:70px;display:block;margin:3px auto;" alt="Review QR">
        </div>
      ` : ''}

      <hr>
      <!-- DEVELOPER BRANDING -->
      <div class="receipt-dev">
        Software Developed by: Debapriya Sarkar<br>
        Contact: 9046356631
      </div>
      <div class="receipt-promo">
        For any Custom Software or Website Development, Contact Us.
      </div>
    </div>
    <button class="btn-primary" style="margin-top:12px;" onclick="printThermalBill()">Print Bill (Thermal Receipt)</button>
  `;
  openSheet("Thermal Receipt", receiptHtml);
}

function printThermalBill() {
  const el = document.getElementById('paper-element');
  if (el) {
    document.getElementById('print-area').innerHTML = el.outerHTML;
    setTimeout(() => { window.print(); }, 120);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    auth.onAuthStateChanged(async (user) => {
      if (!user || user.isAnonymous) {
        window.location.href = 'index.html';
        return;
      }

      // ব্যবহারকারীর রোল যাচাই
      const userDoc = await db.collection("users").doc(user.uid).get();
      if (userDoc.exists) {
        const uRole = userDoc.data().role;
        if (uRole === 'waiter') {
          window.location.href = 'pos.html';
          return;
        } else if (uRole === 'kitchen') {
          window.location.href = 'kitchen.html';
          return;
        }
      }

      // ওনার হিসেবে কনফার্মেশন
      activeCafeId = 'cafe_' + user.uid;
      sessionStorage.setItem('tmpro_cafe_id', activeCafeId);
      sessionStorage.setItem('tmpro_role_mode', 'owner');
      window.CURRENT_USER_ROLE = 'owner';

      bindCafeCloudListener(activeCafeId, renderBills);
    });
  }
});
</script>
</body>
</html>
