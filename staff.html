<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Staff Terminal Login — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body style="min-height:100dvh;padding:16px;background:radial-gradient(ellipse at top left, #1e293b 0%, #0f172a 60%), #0f172a;display:flex;align-items:center;justify-content:center;">

<div style="background:#fff;padding:26px 20px;border-radius:20px;width:100%;max-width:400px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.35);">
  <div style="text-align:center;margin-bottom:18px;">
    <div style="width:50px;height:50px;background:#1e293b;border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:24px;">👨‍🍳</div>
    <h2 style="font-size:19px;font-weight:800;color:#0f172a;">Staff Terminal Login</h2>
    <p style="font-size:12px;color:var(--text-muted);margin-top:2px;">Waiter & Kitchen Live Access</p>
  </div>

  <form onsubmit="handleStaffLogin(event)">
    <label>10-Digit Mobile Number</label>
    <input type="tel" id="stf-phone" pattern="[0-9]{10}" maxlength="10" required placeholder="9876543210" autocomplete="tel">

    <label>Password</label>
    <input type="password" id="stf-pass" required placeholder="••••••••" autocomplete="current-password">

    <button type="submit" class="btn-primary" id="btn-staff-login" style="margin-top:8px;">Sign In to Terminal →</button>
  </form>

  <div style="text-align:center;margin-top:16px;padding-top:12px;border-top:1px solid #f1f5f9;">
    <a href="index.html" style="font-size:12px;color:var(--primary);font-weight:700;text-decoration:none;">← Return to Owner Login</a>
  </div>
</div>

<script>
async function handleStaffLogin(e) {
  e.preventDefault();
  const phone = document.getElementById('stf-phone').value.trim();
  const pass = document.getElementById('stf-pass').value.trim();
  const btn = document.getElementById('btn-staff-login');

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Please enter a valid 10-digit mobile number!");
    return;
  }

  btn.disabled = true; btn.innerText = "Signing in...";

  try {
    sessionStorage.clear(); // ওনার সেশন পুরোপুরি ক্লিয়ার করা
    const staffEmail = `${phone}@tablemaster.com`;
    const cred = await auth.signInWithEmailAndPassword(staffEmail, pass);
    const uid = cred.user.uid;

    const userDoc = await db.collection("users").doc(uid).get();
    if (!userDoc.exists) {
      throw new Error("Staff account profile not found. Please contact Cafe Owner.");
    }

    const userData = userDoc.data();
    sessionStorage.setItem('tmpro_cafe_id', userData.cafeId);
    sessionStorage.setItem('tmpro_role_mode', userData.role);
    window.CURRENT_USER_ROLE = userData.role;

    if (userData.role === 'kitchen') {
      window.location.href = 'kitchen.html';
    } else {
      window.location.href = 'pos.html';
    }
  } catch (err) {
    alert("Staff Login Failed: " + err.message);
  } finally {
    btn.disabled = false; btn.innerText = "Sign In to Terminal →";
  }
}

window.addEventListener('DOMContentLoaded', () => {
  initFirebase();
});
</script>
</body>
</html>
