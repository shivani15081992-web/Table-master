<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Staff Mobile Login — TableMaster Pro</title>
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body style="min-height:100dvh;background:#0f172a;display:flex;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#fff;padding:26px 20px;border-radius:20px;width:100%;max-width:400px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.4);">
    <div style="text-align:center;margin-bottom:18px;">
      <div style="width:50px;height:50px;background:#1a1a1a;border:1.5px solid var(--gold);border-radius:12px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e8d5a1" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      </div>
      <h2 style="font-size:18px;font-weight:800;color:#0f172a;">Staff Access Portal</h2>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">Sign in with your Registered 10-Digit Mobile</p>
    </div>

    <form onsubmit="handleStaffLogin(event)">
      <label>10-Digit Mobile Number</label>
      <input id="stf-phone" type="tel" pattern="[0-9]{10}" maxlength="10" required placeholder="e.g. 9876543210">
      <label>Staff Password</label>
      <input id="stf-pass" type="password" required placeholder="••••••••">
      <button type="submit" class="btn-primary" id="btn-stf-submit" style="margin-top:6px;">Login to Terminal →</button>
    </form>
    <div style="text-align:center;margin-top:14px;">
      <a href="index.html" style="font-size:11.5px;color:var(--text-muted);text-decoration:none;">← Back to Restaurant Owner Login</a>
    </div>
  </div>

<script>
async function handleStaffLogin(e) {
  e.preventDefault();
  const phone = document.getElementById('stf-phone').value.trim();
  const pass = document.getElementById('stf-pass').value.trim();
  const btn = document.getElementById('btn-stf-submit');

  if (!/^[0-9]{10}$/.test(phone)) {
    alert("Please enter a valid 10-digit mobile number!");
    return;
  }

  btn.disabled = true; btn.innerText = "Authenticating...";
  const staffEmail = `${phone}@tablemaster.com`;

  try {
    const cred = await auth.signInWithEmailAndPassword(staffEmail, pass);
    const userDoc = await db.collection("users").doc(cred.user.uid).get();
    if (userDoc.exists) {
      const uData = userDoc.data();
      sessionStorage.setItem('tmpro_role_mode', uData.role || 'waiter');
      sessionStorage.setItem('tmpro_cafe_id', uData.cafeId);
      if (uData.role === 'kitchen') {
        window.location.href = 'kitchen.html';
      } else {
        window.location.href = 'pos.html';
      }
    } else {
      alert("No staff profile assigned to this mobile number!");
    }
  } catch(err) {
    alert("Login Failed: Mobile number or password incorrect.");
  } finally {
    btn.disabled = false; btn.innerText = "Login to Terminal →";
  }
}

window.addEventListener('DOMContentLoaded', () => { initFirebase(); });
</script>
</body>
</html>
