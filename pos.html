<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Waiter Terminal — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging-compat.js"></script>
<script src="shared.js"></script>
<style>
.ready-serve-banner {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border: 1.5px solid #f59e0b;
  border-radius: var(--radius-lg);
  padding: 12px 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.ready-order-item {
  background: #fff;
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #fcd34d;
}
.pending-order-box {
  background: #fff;
  border: 1.5px solid #f59e0b;
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 8px;
}
</style>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" id="header-logo-container"></div>
      <div>
        <span id="txt-cafe-name">Waiter Terminal</span>
        <div id="active-user-role" class="role-badge" style="background:#dbeafe;color:#1e40af;">WAITER</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Connecting...</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage(renderPOS)">🌐 <span id="lbl-lang">English</span></button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN TERMINAL WRAPPER -->
  <main class="main-wrapper">
    
    <!-- 1. CUSTOMER QR ORDERS WAITING FOR WAITER VERIFICATION -->
    <div id="box-waiter-approvals" style="display:none;margin-bottom:14px;">
      <div style="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:12px;padding:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b style="color:#92400e;font-size:13px;">🔔 Customer QR Orders Awaiting Verification</b>
          <span class="badge" style="background:#f59e0b;color:#fff;" id="count-waiter-approvals">0</span>
        </div>
        <div id="waiter-approvals-list"></div>
      </div>
    </div>

    <!-- 2. LIVE WAITER SERVING NOTIFICATION BOX (FROM KITCHEN) -->
    <div class="ready-serve-banner" id="box-ready-serving" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:800;color:#92400e;font-size:13px;">🛎️ Food Prepared — Serve to Table</span>
        <span class="badge" style="background:#f59e0b;color:#fff;" id="count-ready-orders">0 Ready</span>
      </div>
      <div id="ready-orders-list"></div>
    </div>

    <!-- 3. ORDER TAKING CARD -->
    <div class="tm-card">
      <label>Select Floor Table / Channel</label>
      <select id="pos-table-select" onchange="cartState.tableId=this.value; renderPOS();">
        <option value="">-- Choose Channel / Table --</option>
        <optgroup label="🪑 Floor Tables" id="opt-tables"></optgroup>
        <optgroup label="🛍️ Parcel / Takeaway">
          <option value="takeaway">Direct Takeaway / Parcel</option>
        </optgroup>
      </select>

      <div id="active-order-alert" style="display:none;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px;margin-bottom:10px;font-size:12px;color:#1e40af;">
        ℹ️ Active order running on this table. Additional items will add to existing KOT.
      </div>

      <input type="text" id="pos-search-input" placeholder="🔍 Search menu item..." oninput="posSearch=this.value; renderPOS();">

      <div class="cat-scroll" id="cat-tabs"></div>
      <div class="dish-grid" id="dish-grid-box"></div>
    </div>
  </main>

  <!-- FLOATING CART BAR -->
  <div class="floating-cart" id="pos-cart-bar" style="display:none;">
    <div>
      <div style="font-size:10.5px;opacity:0.85;" id="cart-item-count">0 items selected</div>
      <div style="font-size:17px;font-weight:800;" id="cart-subtotal">₹ 0.00</div>
    </div>
    <button class="btn-place" onclick="openCartConfirmation()">Send KOT to Kitchen →</button>
  </div>

  <!-- DYNAMIC NAVIGATION BAR -->
  <nav class="bottom-bar" id="waiter-dynamic-nav"></nav>

  <!-- MODAL SHEET -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
    <div class="sheet-modal">
      <div class="sheet-head">
        <div class="sheet-title" id="sheet-title">Order Confirmation</div>
        <button class="btn-x" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script>
let cartState = { tableId: '', items: [] };
let posCategory = 'All';
let posSearch = '';
let activeCafeId = '';
let lastReadyServeCount = -1;

function handleLogout() {
  const role = sessionStorage.getItem('tmpro_role_mode') || 'owner';
  if (confirm("Log out from Waiter Terminal?")) {
    sessionStorage.clear();
    auth.signOut().then(() => {
      window.location.href = (role === 'owner') ? 'index.html' : 'staff.html';
    });
  }
}

function getChannelName(tId, data) {
  if (tId === 'takeaway') return '🛍️ Parcel / Takeaway';
  const tbl = (data.tables || []).find(t => t.id === tId);
  return tbl ? '🪑 ' + tbl.name : 'Channel: ' + tId;
}

function setupRoleNavigation() {
  const role = sessionStorage.getItem('tmpro_role_mode') || 'owner';
  const nav = document.getElementById('waiter-dynamic-nav');
  
  if (role === 'waiter') {
    nav.innerHTML = `
      <a href="pos.html" class="bar-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
        <span>Waiter POS</span>
      </a>
    `;
    document.getElementById('active-user-role').innerText = "WAITER";
  } else {
    nav.innerHTML = `
      <a href="index.html" class="bar-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 011 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Home</span></a>
      <a href="pos.html" class="bar-item active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg><span>Order</span></a>
      <a href="kitchen.html" class="bar-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg><span>Kitchen</span></a>
      <a href="bills.html" class="bar-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span>Bills</span></a>
      <a href="menu.html" class="bar-item"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg><span>Menu</span></a>
    `;
  }
}

function renderPOS() {
  const data = window.getData();
  updateHeaderBrand(data);
  setupRoleNavigation();
  document.getElementById('lbl-lang').innerText = currentLang === 'en' ? 'English' : 'বাংলা';

  // 1. কাস্টমারের যে কিউআর অর্ডারগুলো অনুমোদনের অপেক্ষায় আছে (Accept / Reject)
  const pendingApprovals = (data.orders || []).filter(o => o.status === 'pending_approval' || o.pendingApproval === true);
  const appBox = document.getElementById('box-waiter-approvals');
  const appList = document.getElementById('waiter-approvals-list');
  const appCount = document.getElementById('count-waiter-approvals');

  if (pendingApprovals.length > 0) {
    appBox.style.display = 'block';
    appCount.innerText = `${pendingApprovals.length} New`;
    appList.innerHTML = pendingApprovals.map(o => `
      <div class="pending-order-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div>
            <b style="font-size:14px;color:#0f172a;">${getChannelName(o.tableId, data)}</b>
            <span style="font-size:11.5px;color:#1e40af;font-weight:700;display:block;">👤 ${o.custName || 'Customer'} (📞 ${o.custPhone || 'N/A'})</span>
          </div>
          <span style="font-weight:800;color:#059669;font-size:13px;">₹ ${(o.total||0).toFixed(2)}</span>
        </div>
        <div style="font-size:12px;color:#475569;margin-bottom:8px;">
          ${(o.items||[]).map(i => `${i.qty}x ${i.name}`).join(', ')}
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-primary" style="flex:1;padding:7px;font-size:12px;background:#059669;" onclick="waiterAcceptQROrder('${o.id}')">✓ Verify & Send to Kitchen</button>
          <button class="btn-danger" style="flex:0.35;padding:7px;font-size:12px;" onclick="waiterRejectQROrder('${o.id}')">✕ Reject</button>
        </div>
      </div>
    `).join('');
  } else {
    appBox.style.display = 'none';
  }

  // 2. কিচেন থেকে রেডি হওয়া খাবার
  const readyOrders = (data.orders || []).filter(o => o.status === 'ready_to_serve');
  const readyBanner = document.getElementById('box-ready-serving');
  const readyList = document.getElementById('ready-orders-list');
  const countBadge = document.getElementById('count-ready-orders');

  if (lastReadyServeCount !== -1 && readyOrders.length > lastReadyServeCount) {
    window.playAlertTone('ready');
  }
  lastReadyServeCount = readyOrders.length;

  if (readyOrders.length > 0) {
    readyBanner.style.display = 'block';
    countBadge.innerText = `${readyOrders.length} Ready`;
    readyList.innerHTML = readyOrders.map(o => `
      <div class="ready-order-item">
        <div>
          <b style="color:#0f172a;font-size:14px;">${getChannelName(o.tableId, data)}</b>
          <div style="font-size:11.5px;color:#64748b;margin-top:2px;">
            KOT #${o.kotNo} (${(o.items||[]).length} dishes prepared)
          </div>
        </div>
        <button class="btn-primary" style="width:auto;padding:7px 14px;font-size:12px;background:#059669;" onclick="confirmFoodServed('${o.id}')">
          Food Served ✓
        </button>
      </div>
    `).join('');
  } else {
    readyBanner.style.display = 'none';
  }

  // 3. Table Dropdown
  const optTables = document.getElementById('opt-tables');
  optTables.innerHTML = (data.tables || []).map(tData => `
    <option value="${tData.id}" ${cartState.tableId === tData.id ? 'selected':''}>
      ${tData.name} (${tData.seats} Seater) - ${tData.status.toUpperCase()}
    </option>
  `).join('');

  // 4. Active Order Alert
  const activeOrder = (data.orders || []).find(o => o.tableId === cartState.tableId && o.status !== 'completed');
  document.getElementById('active-order-alert').style.display = activeOrder ? 'block' : 'none';

  // 5. Menu Categories & Dishes Grid
  const cats = ['All', ...new Set((data.menu || []).map(m => m.category || 'General'))];
  document.getElementById('cat-tabs').innerHTML = cats.map(c => `
    <button class="cat-btn ${posCategory === c ? 'active':''}" onclick="posCategory='${c}'; renderPOS();">${c}</button>
  `).join('');

  let dishes = posCategory === 'All' ? (data.menu || []) : (data.menu || []).filter(m => (m.category || 'General') === posCategory);
  if (posSearch.trim()) {
    const q = posSearch.toLowerCase();
    dishes = dishes.filter(d => (d.name && d.name.toLowerCase().includes(q)) || (d.category && d.category.toLowerCase().includes(q)));
  }

  document.getElementById('dish-grid-box').innerHTML = dishes.map(d => {
    const isAvail = d.available !== false;
    return `
      <div class="dish-card ${!isAvail ? 'dish-paused' : ''}" ${isAvail ? `onclick="addToPOSCart('${d.id}')"` : ''}>
        <div class="dish-name">${d.name} ${!isAvail ? '<small style="color:#b91c1c;">(Out of Stock)</small>' : ''}</div>
        <div class="dish-price">₹ ${d.price}</div>
      </div>
    `;
  }).join('');

  // 6. Cart Bar
  const cartBar = document.getElementById('pos-cart-bar');
  const count = cartState.items.reduce((s, i) => s + i.qty, 0);
  const total = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  if (count > 0) {
    cartBar.style.display = 'flex';
    document.getElementById('cart-item-count').innerText = `${count} items selected`;
    document.getElementById('cart-subtotal').innerText = `₹ ${total.toFixed(2)}`;
  } else {
    cartBar.style.display = 'none';
  }
}

// ওয়েটার কিউআর অর্ডার অ্যাকসেপ্ট করার ফাংশন
async function waiterAcceptQROrder(orderId) {
  if (!activeCafeId || !db) return;
  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const orders = cData.orders || [];
    const tables = cData.tables || [];

    const o = orders.find(ord => ord.id === orderId);
    if (o) {
      o.status = 'preparing'; // কিচেনে চলে গেল
      o.pendingApproval = false;

      const tbl = tables.find(t => t.id === o.tableId);
      if (tbl) tbl.status = 'occupied';

      await cafeRef.update({ orders, tables });
      alert("✓ Order Verified! KOT sent to kitchen.");
      renderPOS();
    }
  } catch(err) {
    alert("Action failed: " + err.message);
  }
}

// ওয়েটার কিউআর অর্ডার রিজেক্ট করার ফাংশন
async function waiterRejectQROrder(orderId) {
  if (!confirm("Are you sure you want to REJECT this customer QR order?")) return;
  if (!activeCafeId || !db) return;

  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    let orders = cData.orders || [];
    orders = orders.filter(ord => ord.id !== orderId);

    await cafeRef.update({ orders });
    alert("Order Rejected.");
    renderPOS();
  } catch(err) {
    alert("Action failed: " + err.message);
  }
}

function addToPOSCart(dishId) {
  const data = window.getData();
  const dish = (data.menu || []).find(d => d.id === dishId);
  if (!dish || dish.available === false) return;
  const existing = cartState.items.find(i => i.dishId === dishId);
  if (existing) {
    existing.qty += 1;
  } else {
    cartState.items.push({ dishId, name: dish.name, price: dish.price, qty: 1, isAddOn: false });
  }
  renderPOS();
}

function openCartConfirmation() {
  if (!cartState.tableId) {
    alert("Please select a Floor Table first!");
    return;
  }
  const data = window.getData();
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const gstRate = parseFloat(data.gstRate) || 0;
  const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
  const total = subtotal + gst;

  let channelLabel = getChannelName(cartState.tableId, data);

  const body = `
    <div style="font-weight:700;margin-bottom:10px;">Destination: ${channelLabel}</div>
    <div style="margin-bottom:12px;">
      ${cartState.items.map((it, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;">
          <div><b>${it.name}</b><br><small>₹ ${it.price} each</small></div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="qty-btn" onclick="changePOSQty(${idx}, -1)">−</button>
            <b>${it.qty}</b>
            <button class="qty-btn" onclick="changePOSQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
      <span>Subtotal:</span><span>₹ ${subtotal.toFixed(2)}</span>
    </div>
    ${gstRate > 0 ? `
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
        <span>GST (${gstRate}%):</span><span>₹ ${gst.toFixed(2)}</span>
      </div>
    ` : ''}
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-top:6px;margin-bottom:12px;border-top:1px dashed var(--border);padding-top:6px;">
      <span>Total:</span><span>₹ ${total.toFixed(2)}</span>
    </div>
    <button class="btn-primary" id="btn-dispatch-order" onclick="dispatchOrderToKitchen()">Send KOT to Kitchen →</button>
  `;
  openSheet("Confirm Waiter Order", body);
}

function changePOSQty(idx, delta) {
  cartState.items[idx].qty += delta;
  if (cartState.items[idx].qty <= 0) cartState.items.splice(idx, 1);
  if (cartState.items.length === 0) closeSheet();
  else openCartConfirmation();
  renderPOS();
}

async function dispatchOrderToKitchen() {
  if (cartState.items.length === 0 || !activeCafeId || !db) return;
  const btn = document.getElementById('btn-dispatch-order');
  if (btn) { btn.disabled = true; btn.innerText = "Dispatching..."; }

  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) throw new Error("Cafe data not found!");

    const cData = docSnap.data();
    if (!cData.orders) cData.orders = [];
    if (!cData.tables) cData.tables = [];

    const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
    const gstRate = parseFloat(cData.gstRate) || 0;
    const gst = gstRate > 0 ? (subtotal * (gstRate / 100)) : 0;
    const total = subtotal + gst;

    const existingOrder = cData.orders.find(o => o.tableId === cartState.tableId && o.status !== 'completed');

    if (existingOrder) {
      existingOrder.items.forEach(it => it.isAddOn = false);
      cartState.items.forEach(newItem => {
        const match = existingOrder.items.find(i => i.dishId === newItem.dishId);
        if (match) {
          match.qty += newItem.qty;
          match.isAddOn = true;
        } else {
          existingOrder.items.push({ ...newItem, isAddOn: true });
        }
      });
      existingOrder.subtotal = existingOrder.items.reduce((s, i) => s + (i.price * i.qty), 0);
      existingOrder.gst = gstRate > 0 ? (existingOrder.subtotal * (gstRate / 100)) : 0;
      existingOrder.total = existingOrder.subtotal + existingOrder.gst;
      existingOrder.status = 'preparing';
    } else {
      const orderNum = 100 + cData.orders.length + 1;
      cData.orders.push({
        id: 'ord_' + Date.now(),
        kotNo: orderNum,
        billNo: orderNum,
        tableId: cartState.tableId,
        items: cartState.items.map(it => ({ ...it, isAddOn: true })),
        subtotal,
        gst,
        gstRate,
        total,
        status: 'preparing',
        source: 'waiter_pos',
        date: window.todayStr(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
    }

    const tbl = cData.tables.find(t => t.id === cartState.tableId);
    if (tbl) tbl.status = 'occupied';

    await cafeRef.update({
      orders: cData.orders,
      tables: cData.tables
    });

    cartState = { tableId: '', items: [] };
    closeSheet();
    alert("KOT dispatched to kitchen successfully!");
    renderPOS();
  } catch (err) {
    alert("Order failed: " + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerText = "Send KOT to Kitchen →"; }
  }
}

async function confirmFoodServed(orderId) {
  if (!activeCafeId || !db) return;
  try {
    const cafeRef = db.collection("cafes").doc(activeCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const orders = cData.orders || [];
    const o = orders.find(ord => ord.id === orderId);
    if (o) {
      o.status = 'served';
      await cafeRef.update({ orders });
      alert("Food marked as Served at the table! ✓");
      renderPOS();
    }
  } catch(err) {
    alert("Action failed: " + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('table')) cartState.tableId = urlParams.get('table');

    auth.onAuthStateChanged((user) => {
      activeCafeId = sessionStorage.getItem('tmpro_cafe_id') || (user ? 'cafe_' + user.uid : null);
      if (activeCafeId) {
        bindCafeCloudListener(activeCafeId, renderPOS);
        window.enableFCMNotifications('waiter');
      } else {
        window.location.href = 'staff.html';
      }
    });
  }
});
</script>
</body>
</html>
