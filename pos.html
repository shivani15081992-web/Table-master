<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>POS Order — TableMaster Pro</title>
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-box">
      <span id="txt-cafe-name">TableMaster POS</span>
      <div id="active-user-role" class="role-badge">ORDER</div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Online</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage(renderPOS)">🌐</button>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tm-card">
      <label>Select Table / Channel</label>
      <select id="pos-table-select" onchange="cartState.tableId=this.value; renderPOS();">
        <option value="">-- Choose Channel --</option>
        <optgroup label="🪑 Floor Tables" id="opt-tables"></optgroup>
        <optgroup label="🛵 Online / Takeaway">
          <option value="takeaway">🛍️ Direct Takeaway / Parcel</option>
          <option value="plt_swiggy">🛵 Swiggy Partner</option>
          <option value="plt_zomato">🛵 Zomato Partner</option>
        </optgroup>
      </select>

      <input type="text" id="pos-search-input" placeholder="🔍 Search menu item or category..." oninput="posSearch=this.value; renderPOS();">

      <div class="cat-scroll" id="cat-tabs"></div>
      <div class="dish-grid" id="dish-grid-box"></div>
    </div>
  </main>

  <div class="floating-cart" id="pos-cart-bar" style="display:none;">
    <div>
      <div style="font-size:10.5px;opacity:0.85;" id="cart-item-count">0 items</div>
      <div style="font-size:17px;font-weight:800;" id="cart-subtotal">₹ 0.00</div>
    </div>
    <button class="btn-place" onclick="openCartConfirmation()">Send KOT to Kitchen →</button>
  </div>

  <nav class="bottom-bar">
    <a href="index.html" class="bar-item">Home</a>
    <a href="pos.html" class="bar-item active">Order</a>
    <a href="kitchen.html" class="bar-item">Kitchen</a>
    <a href="bills.html" class="bar-item">Bills</a>
    <a href="menu.html" class="bar-item">Menu</a>
  </nav>

  <!-- MODAL -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="sheetBackdropClick(event)">
    <div class="sheet-modal">
      <div class="sheet-head">
        <div class="sheet-title" id="sheet-title">Order Confirmation</div>
        <button class="btn-x" onclick="closeSheet()">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

<script>
let cartState = { tableId: '', items: [] };
let posCategory = 'All';
let posSearch = '';

function renderPOS() {
  const data = window.getData();
  updateHeaderBrand(data);

  const optTables = document.getElementById('opt-tables');
  optTables.innerHTML = (data.tables || []).map(t => `
    <option value="${t.id}" ${cartState.tableId === t.id ? 'selected':''}>${t.name} (${t.seats} Seater) - ${t.status.toUpperCase()}</option>
  `).join('');

  const cats = ['All', ...new Set((data.menu || []).map(m => m.category))];
  document.getElementById('cat-tabs').innerHTML = cats.map(c => `
    <button class="cat-btn ${posCategory === c ? 'active':''}" onclick="posCategory='${c}'; renderPOS();">${c}</button>
  `).join('');

  let dishes = posCategory === 'All' ? (data.menu || []) : (data.menu || []).filter(m => m.category === posCategory);
  if (posSearch.trim()) {
    const q = posSearch.toLowerCase();
    dishes = dishes.filter(d => d.name.toLowerCase().includes(q) || (d.category||'').toLowerCase().includes(q));
  }

  document.getElementById('dish-grid-box').innerHTML = dishes.map(d => `
    <div class="dish-card" onclick="addToPOSCart('${d.id}')">
      <div class="dish-name">${d.name}</div>
      <div class="dish-price">₹ ${d.price}</div>
    </div>
  `).join('');

  const cartBar = document.getElementById('pos-cart-bar');
  const count = cartState.items.reduce((s, i) => s + i.qty, 0);
  const total = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  if (count > 0) {
    cartBar.style.display = 'flex';
    document.getElementById('cart-item-count').innerText = `${count} items selected`;
    document.getElementById('cart-subtotal').innerText = `₹ ${total.toFixed(2)}`;
  } else {
    cartBar.style.display = 'none';
  }
}

function addToPOSCart(dishId) {
  const data = window.getData();
  const dish = (data.menu || []).find(d => d.id === dishId);
  if (!dish) return;
  const existing = cartState.items.find(i => i.dishId === dishId);
  if (existing) existing.qty += 1;
  else cartState.items.push({ dishId, name: dish.name, price: dish.price, qty: 1, isAddOn: false });
  renderPOS();
}

function openCartConfirmation() {
  if (!cartState.tableId) { alert("Please select a Table or Channel first!"); return; }
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);
  const body = `
    <div style="margin-bottom:12px;">
      ${cartState.items.map((it, idx) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;">
          <div><b>${it.name}</b><br><small>₹ ${it.price} each</small></div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <b>${it.qty}</b>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:12px;">
      <span>Total:</span><span>₹ ${subtotal.toFixed(2)}</span>
    </div>
    <button class="btn-primary" onclick="dispatchOrderToKitchen()">Confirm & Dispatch to Kitchen</button>
  `;
  openSheet("Confirm Order", body);
}

function changeQty(idx, delta) {
  cartState.items[idx].qty += delta;
  if (cartState.items[idx].qty <= 0) cartState.items.splice(idx, 1);
  if (cartState.items.length === 0) closeSheet();
  else openCartConfirmation();
  renderPOS();
}

function dispatchOrderToKitchen() {
  const data = window.getData();
  if (!data.orders) data.orders = [];
  const orderNum = 100 + data.orders.length + 1;
  const subtotal = cartState.items.reduce((s, i) => s + (i.price * i.qty), 0);

  data.orders.push({
    id: 'ord_' + Date.now(), kotNo: orderNum, billNo: orderNum,
    tableId: cartState.tableId, items: cartState.items,
    subtotal, total: subtotal, status: 'preparing',
    date: window.todayStr(),
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  const tbl = (data.tables || []).find(t => t.id === cartState.tableId);
  if (tbl) tbl.status = 'occupied';

  window.cloudSave();
  cartState = { tableId: '', items: [] };
  closeSheet();
  window.location.href = 'kitchen.html';
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('table')) cartState.tableId = urlParams.get('table');

    auth.onAuthStateChanged((user) => {
      let cafeId = sessionStorage.getItem('tmpro_cafe_id') || (user ? 'cafe_' + user.uid : null);
      if (cafeId) bindCafeCloudListener(cafeId, renderPOS);
      else window.location.href = 'index.html';
    });
  }
});
</script>
</body>
</html>
