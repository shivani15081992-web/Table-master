<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Live Kitchen KOT — TableMaster Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a1a">
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand-box">
      <div class="brand-icon" id="header-logo-container"></div>
      <div>
        <span id="txt-cafe-name">Kitchen KOT Live</span>
        <div id="active-user-role" class="role-badge" style="background:#fef3c7;color:#b45309;">KITCHEN</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Connecting...</div>
      <button class="lang-toggle-btn" onclick="toggleLanguage(renderKitchen)">🌐 <span id="lbl-lang">English</span></button>
      <button class="btn-icon" onclick="handleLogout()" title="Logout" style="color:var(--danger)">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN KITCHEN WRAPPER -->
  <main class="main-wrapper">
    <div class="tm-card">
      <div class="tm-card-title">
        <span>👨‍🍳 Orders In Preparation (Cooking)</span>
        <small style="color:var(--warning);font-weight:700;" id="kot-count-live">0 Active</small>
      </div>
      <div id="kitchen-kot-list" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-bar" id="kitchen-nav-bar">
    <a href="kitchen.html" class="bar-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
      <span>Kitchen</span>
    </a>
  </nav>

<script>
let currentCafeId = '';
let lastKnownKOTCount = -1;

function handleLogout() {
  const role = sessionStorage.getItem('tmpro_role_mode') || 'owner';
  if (confirm("Log out from Kitchen Monitor?")) {
    sessionStorage.removeItem('tmpro_role_mode');
    sessionStorage.removeItem('tmpro_cafe_id');
    auth.signOut().then(() => {
      window.location.href = (role === 'owner') ? 'index.html' : 'staff.html';
    });
  }
}

function getChannelLabel(tId, data) {
  if (tId && tId.startsWith('plt_')) {
    const p = (data.platforms || []).find(x => x.id === tId);
    return p ? '🛵 ' + p.name : '🛵 Online';
  }
  if (tId === 'takeaway') return '🛍️ Parcel / Takeaway';
  const tbl = (data.tables || []).find(t => t.id === tId);
  return tbl ? '🪑 ' + tbl.name : 'Channel: ' + tId;
}

function renderKitchen() {
  const data = window.getData();
  updateHeaderBrand(data);
  document.getElementById('lbl-lang').innerText = currentLang === 'en' ? 'English' : 'বাংলা';

  const liveKOT = (data.orders || []).filter(o => o.status === 'preparing');
  document.getElementById('kot-count-live').innerText = `${liveKOT.length} Active`;

  // নতুন KOT আসলে কিচেন বেল (Double Ding) বাজবে
  if (lastKnownKOTCount !== -1 && liveKOT.length > lastKnownKOTCount) {
    window.playAlertTone('kot');
  }
  lastKnownKOTCount = liveKOT.length;

  const container = document.getElementById('kitchen-kot-list');
  if (liveKOT.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:36px 16px;color:var(--text-muted);font-weight:600;">No pending food orders in kitchen right now! 🍽️</div>';
    return;
  }

  container.innerHTML = liveKOT.map(o => `
    <div style="border:2px solid #fed7aa;border-radius:12px;padding:14px;background:#fff;box-shadow:var(--shadow-sm);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #f1f5f9;padding-bottom:8px;">
        <div>
          <strong style="font-size:16px;color:#0f172a;">${getChannelLabel(o.tableId, data)}</strong>
          <span style="font-size:12px;color:var(--text-muted);display:block;margin-top:2px;">KOT #${o.kotNo} · Time: ${o.time || ''}</span>
        </div>
        <span style="font-size:10.5px;padding:3px 8px;border-radius:12px;background:#fef3c7;color:#b45309;font-weight:800;">COOKING</span>
      </div>
      <div style="font-size:13.5px;color:#1e293b;line-height:1.7;margin-bottom:14px;">
        ${(o.items || []).map(i => `
          <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #f1f5f9;">
            <span>• <b>${i.qty}x</b> ${i.name}</span>
            ${i.isAddOn ? `<span style="font-size:9.5px;background:#fee2e2;color:#b91c1c;font-weight:800;padding:1px 6px;border-radius:4px;">NEW ADD-ON</span>` : ''}
          </div>
        `).join('')}
      </div>
      <button class="btn-primary" style="padding:11px;font-size:13.5px;background:linear-gradient(135deg, #059669 0%, #047857 100%);" onclick="markKOTReady('${o.id}')">
        ✓ Food Prepared (Send to Waiter)
      </button>
    </div>
  `).join('');
}

async function markKOTReady(orderId) {
  if (!currentCafeId || !db) return;
  try {
    const cafeRef = db.collection("cafes").doc(currentCafeId);
    const docSnap = await cafeRef.get();
    if (!docSnap.exists) return;

    const cData = docSnap.data();
    const orders = cData.orders || [];
    const o = orders.find(ord => ord.id === orderId);
    if (o) {
      o.status = 'ready_to_serve';
      (o.items || []).forEach(it => it.isAddOn = false);
      await cafeRef.update({ orders: orders });
    }
  } catch(err) {
    alert("Failed to update KOT status: " + err.message);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    auth.onAuthStateChanged((user) => {
      currentCafeId = sessionStorage.getItem('tmpro_cafe_id') || (user ? 'cafe_' + user.uid : null);
      if (currentCafeId) {
        bindCafeCloudListener(currentCafeId, renderKitchen);
        // কিচেনের ফোনে ব্যাকগ্রাউন্ড পুশ পারমিশন সক্রিয় করা
        window.enableFCMNotifications('kitchen');
      } else {
        window.location.href = 'staff.html';
      }
    });
  }
});
</script>
</body>
</html>
