<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Reports & Profit — TableMaster Pro</title>
<link rel="stylesheet" href="shared.css">
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-box">
      <span id="txt-cafe-name">Profit & Reports</span>
      <div class="role-badge">ANALYTICS</div>
    </div>
    <div class="top-actions">
      <div class="sync-badge syncing" id="sync-status">🔄 Online</div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="tm-card">
      <div class="tm-card-title">
        <span>Financial Summary</span>
        <button class="btn-sm-outline" onclick="exportCSVReport()">📥 Export CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <div style="background:#ecfdf5;border:1px solid #a7f3d0;padding:12px;border-radius:10px;">
          <div style="font-size:11px;color:#047857;font-weight:700;">TOTAL SALES</div>
          <div style="font-size:20px;font-weight:800;color:#065f46;margin-top:2px;" id="rep-sales">₹ 0.00</div>
        </div>
        <div style="background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:10px;">
          <div style="font-size:11px;color:#b91c1c;font-weight:700;">TOTAL EXPENSE</div>
          <div style="font-size:20px;font-weight:800;color:#991b1b;margin-top:2px;" id="rep-expense">₹ 0.00</div>
        </div>
      </div>
      <div class="profit-banner profit" id="profit-box">
        <div>
          <div class="label">NET PROFIT / LOSS</div>
          <div class="val" id="rep-net-profit">₹ 0.00</div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-bar">
    <a href="index.html" class="bar-item">Home</a>
    <a href="pos.html" class="bar-item">Order</a>
    <a href="reports.html" class="bar-item active">Reports</a>
    <a href="bills.html" class="bar-item">Bills</a>
    <a href="menu.html" class="bar-item">Menu</a>
  </nav>

<script>
function renderReports() {
  const data = window.getData();
  updateHeaderBrand(data);
  const totalSales = (data.orders || []).filter(o => o.status === 'completed').reduce((s, o) => s + (o.total||0), 0);
  const totalExp = (data.expenses || []).reduce((s, e) => s + (e.amount||0), 0);
  const profit = totalSales - totalExp;

  document.getElementById('rep-sales').innerText = `₹ ${totalSales.toFixed(2)}`;
  document.getElementById('rep-expense').innerText = `₹ ${totalExp.toFixed(2)}`;
  document.getElementById('rep-net-profit').innerText = `₹ ${profit.toFixed(2)}`;
  const pBox = document.getElementById('profit-box');
  pBox.className = profit >= 0 ? 'profit-banner profit' : 'profit-banner loss';
}

function exportCSVReport() {
  const data = window.getData();
  let csv = "TableMaster Pro - Financial Statement\n";
  csv += "Software Developer,Debapriya Sarkar (9046356631)\n";
  csv += "Type,Date,Description,Amount\n";
  (data.orders || []).filter(o => o.status === 'completed').forEach(o => {
    csv += `Sales,${o.date},Bill #${o.billNo},${o.total.toFixed(2)}\n`;
  });
  (data.expenses || []).forEach(e => {
    csv += `Expense,${e.date},"${e.desc}",${e.amount.toFixed(2)}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `Report_${window.todayStr()}.csv`; a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  if (initFirebase()) {
    auth.onAuthStateChanged((user) => {
      let cafeId = sessionStorage.getItem('tmpro_cafe_id') || (user ? 'cafe_' + user.uid : null);
      if (cafeId) bindCafeCloudListener(cafeId, renderReports);
      else window.location.href = 'index.html';
    });
  }
});
</script>
</body>
</html>
